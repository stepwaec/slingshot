<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Hull HUD and tidal-stress warning (ship systems). ONE group #hudHull at translate(0 0) (a sample sheet). Ids: hh* (none needed).
       Placement in the game HUD (style.md §6): the hull block sits under the fuel block, x 1180-1400: "HULL" 11 px uppercase muted weight 500 at
       baseline 96, percentage 12 px mono right-aligned at x 1400, bar of 10 segments at y 104 (each 20.2 × 8, gap 2, radius 2), track #FFFFFF α 0.08.
       Segmented so it never reads as the (continuous) fuel bar. Fill: hull.ok #9FC4FF at >= 60 %, hull.warn #FFC857 at 30-59 %, hull.critical
       #FF5A5F below 30 % (bar and percentage pulse α 1 -> 0.45, 1 s). A hit flashes the lost segment #FFFFFF for 120 ms, then it empties (140 ms ease-out).
       Tidal-stress chip, 220 × 26 at y 122 (radius 7, panel fill #0A0D1A, 1 px border in the stress colour), only while stress > 0: stretch icon
       (double arrow + dot, 1.4 px), "TIDAL STRESS" 11 px weight 500 letter-spacing 1.3, three level cells 9 × 12 at the right. Levels 1-2 stress.warn
       #FF9F43; level 3 (the hull is losing points) stress.critical #FF5A5F and the chip pulses α 1 -> 0.5 over 0.8 s.
       In the world (flight and planning): two pairs of chevrons 15-24 px from the ship centre, pointing OUTWARD along the stretch axis (the line to
       the mass causing it), stroke 1.6 in the stress colour, pulsing α 1 -> 0.35 every 0.8 s (0.5 s at level 3). Screen-space, never scaled.
       Tokens: style.md §8 Ship systems (hull.*, stress.*). -->
  <defs><linearGradient id="hhSHull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C6E4"/><stop offset="0.3" stop-color="#E9EEF9"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E9EEF9"/><stop offset="1" stop-color="#B9C6E4"/></linearGradient> <radialGradient id="hhSCanopy" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#CFE8FF"/><stop offset="0.45" stop-color="#5EA0FF"/><stop offset="1" stop-color="#1E4FB8"/></radialGradient> <linearGradient id="hhSSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8496C4"/><stop offset="0.5" stop-color="#DCE4F6"/><stop offset="1" stop-color="#8496C4"/></linearGradient> <linearGradient id="hhSArmor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4E66A0"/><stop offset="0.5" stop-color="#7F98CF"/><stop offset="1" stop-color="#4E66A0"/></linearGradient> <linearGradient id="hhSSolar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E62D8"/><stop offset="0.55" stop-color="#1E3F9E"/><stop offset="1" stop-color="#15307E"/></linearGradient> <linearGradient id="hhSTank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C6E4"/><stop offset="0.45" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A9B8DC"/></linearGradient> <linearGradient id="hhSPlumeChem" gradientUnits="userSpaceOnUse" x1="0" y1="28" x2="0" y2="70"><stop offset="0" stop-color="#F7FBFF"/><stop offset="0.22" stop-color="#D6C8FF" stop-opacity="0.9"/><stop offset="0.55" stop-color="#A06BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#7A4AD8" stop-opacity="0"/></linearGradient> <linearGradient id="hhSPlumeIon" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="80"><stop offset="0" stop-color="#E6F4FF"/><stop offset="0.3" stop-color="#8FC2FF" stop-opacity="0.75"/><stop offset="0.7" stop-color="#A06BFF" stop-opacity="0.3"/><stop offset="1" stop-color="#A06BFF" stop-opacity="0"/></linearGradient> <radialGradient id="hhSPulse" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#E2D4FF" stop-opacity="0.9"/><stop offset="0.7" stop-color="#A06BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#7A4AD8" stop-opacity="0"/></radialGradient> <radialGradient id="hhSScorch" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1E1410" stop-opacity="0.75"/><stop offset="0.6" stop-color="#3A2418" stop-opacity="0.45"/><stop offset="1" stop-color="#3A2418" stop-opacity="0"/></radialGradient> <radialGradient id="hhSBreach" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB45A"/><stop offset="0.4" stop-color="#FF6A2A"/><stop offset="1" stop-color="#141A33"/></radialGradient></defs>
