<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Burn node (ship and planning view): the maneuver node on the predicted path and its burn arrow, in every state. ONE group #burnNode at translate(0 0)
       (a sample sheet: seven states at 2.4x, with the 1x game size under each). Ids: kn*. Screen-space, never scaled with zoom (like the path dots).
       MARKER: ring r 5, stroke 2, node.ring #B8A8FF (the engine family, between plume #D6C8FF and #A06BFF), fill #0A0D1A, centre dot r 1.7 node.core #F7FBFF.
         It replaces the gold #FFC857 disc, which sat next to the gold recharge dots and doubled as fuel.low.
       INDEX: the burn's number (1 or 2, at most two queued) 9 px mono #8B95B5 at (+7, -8).
       ARROW (unchanged geometry from drag-arrow.svg): shaft #FFFFFF a0.9 2 px from r 7, head 11 long x 10 wide in the power ramp (#3DE0C2 -> #FFC857 -> #FF5A5F
         by cost / fuel, = arrow.power), 0.8 px #0A0D1A outline.
       STATES:
         idle        ring + core.
         selected    ring r 6.5 in #FFFFFF + an outer ring r 9.5 #B8A8FF a0.55 1 px; a chip by the arrow head "dv 1.8 · 12 %" (10.5 px mono, panel fill a0.85,
                     radius 5, border #FFFFFF a0.12); a delete button r 6 at (+13, +11) with an x, only for unfired burns.
         placing     dashed ghost line #FFFFFF a0.3 (3 3) to a handle r 4 #ECF0FA while dragging.
         over budget ring, core and arrow head #FF5A5F; the chip reads "dv 6.2 · +18 % over" in #FF5A5F.
         wind-up     (flight, the 0.5 s before the burn, sim time) a white arc r 9, 2 px, round caps, fills clockwise from 12 o'clock over 0.5 s.
         ignition    a flash ring r 6 -> 18, #F7FBFF 1.5 px, a1 -> 0 over 0.4 s; then the node is spent.
         fired       ring dashed 2 2, #B8A8FF a0.45, no core: history, not editable.
       Tokens: style.md §12 (node.*). -->
