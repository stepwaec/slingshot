<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Flight trail sample. 24 segments, stroke 2 px, alpha steps from 0 at the tail (left) to 1 at the head (right).
       Each segment stands for 10 game samples, so the 24 segments are a full 240-sample buffer and the alphas are
       canvas-notes §7's rule α = 1 − (count−1−i)/240 evaluated every 10 samples: 1 − (23−j)/24 for segment j. -->
  <g id="trail" fill="none" stroke="#5EA0FF" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="150" x2="52.4" y2="153.9" opacity="0.042"/>
    <line x1="52.4" y1="153.9" x2="74.4" y2="155.7" opacity="0.083"/>
    <line x1="74.4" y1="155.7" x2="96.3" y2="155.6" opacity="0.125"/>
    <line x1="96.3" y1="155.6" x2="117.9" y2="153.8" opacity="0.167"/>
    <line x1="117.9" y1="153.8" x2="139.4" y2="150.4" opacity="0.208"/>
    <line x1="139.4" y1="150.4" x2="160.8" y2="145.8" opacity="0.25"/>
    <line x1="160.8" y1="145.8" x2="182.1" y2="140.1" opacity="0.292"/>
    <line x1="182.1" y1="140.1" x2="203.3" y2="133.4" opacity="0.333"/>
    <line x1="203.3" y1="133.4" x2="224.6" y2="126" opacity="0.375"/>
    <line x1="224.6" y1="126" x2="245.9" y2="118.1" opacity="0.417"/>
    <line x1="245.9" y1="118.1" x2="267.3" y2="109.9" opacity="0.458"/>
    <line x1="267.3" y1="109.9" x2="288.8" y2="101.5" opacity="0.5"/>
    <line x1="288.8" y1="101.5" x2="310.4" y2="93.2" opacity="0.542"/>
    <line x1="310.4" y1="93.2" x2="332.2" y2="85.1" opacity="0.583"/>
    <line x1="332.2" y1="85.1" x2="354.3" y2="77.5" opacity="0.625"/>
    <line x1="354.3" y1="77.5" x2="376.7" y2="70.6" opacity="0.667"/>
    <line x1="376.7" y1="70.6" x2="399.3" y2="64.5" opacity="0.708"/>
    <line x1="399.3" y1="64.5" x2="422.3" y2="59.4" opacity="0.75"/>
    <line x1="422.3" y1="59.4" x2="445.7" y2="55.6" opacity="0.792"/>
    <line x1="445.7" y1="55.6" x2="469.6" y2="53.2" opacity="0.833"/>
    <line x1="469.6" y1="53.2" x2="493.9" y2="52.5" opacity="0.875"/>
    <line x1="493.9" y1="52.5" x2="518.7" y2="53.6" opacity="0.917"/>
    <line x1="518.7" y1="53.6" x2="544.1" y2="56.7" opacity="0.958"/>
    <line x1="544.1" y1="56.7" x2="570" y2="62" opacity="1"/>
  </g>
  <!-- ship at the head (ship.svg geometry, anchor 12,12, scaled 0.75 ≈ 14 px hull), nose along the travel direction -->
  <g transform="translate(570 62) rotate(103.9) scale(0.75) translate(-12 -12)">
    <g stroke="#0A0D1A" stroke-width="1" stroke-linejoin="round">
      <polygon fill="#F2F5FF" points="8.2,12.5 4,19.2 7,19.6"/>
      <polygon fill="#F2F5FF" points="15.8,12.5 20,19.2 17,19.6"/>
      <polygon fill="#F2F5FF" points="12,2 18.5,21 12,16.5 5.5,21"/>
    </g>
    <rect x="11.2" y="7.5" width="1.6" height="4" rx="0.8" fill="#5EA0FF"/>
  </g>
</svg>
