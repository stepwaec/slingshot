<svg xmlns="http://www.w3.org/2000/svg" width="540" height="330" viewBox="0 0 540 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Astrophage fuel row (v3.2), the second row of the fuel block (top-right, canvas-notes §10), shown only when a spin drive is fitted. ONE group
       #hudAstrophage: four samples at 1x - no spin drive (no row) · harvesting · planning ghost · full. Ids: ha*.
       Row: label "ASTROPHAGE" 11 px 500 +1.54 #FF3D6E at baseline 36; value 12 px mono #ECF0FA right-aligned at 220; track 220 x 8 rx 4 #FFFFFF a0.08 at y 44;
       fill linear #C8285A | 0.7 #FF3D6E | 1 #FF7A9C overlaid with the cells pattern #haCells (7 x 8 tile: #1A0610 dots r 0.55 a0.75 / r 0.5 a0.6, a #FFF2F6
       glint r 0.35 a0.5). Harvesting: a #FFF2F6 four-point sparkle on the leading edge scaling 0.6 -> 1.2 (0.9 s) and the fill flashing white a0 -> 0.25;
       chip "harvesting +N %/s" (#FF3D6E). Planning ghost: the share a planned path will harvest, #FF3D6E a0.35 with a #FFC2D2 dashed outline (2 2), chip
       "+N % on this path" (#FFC2D2) - like the solar-recharge ghost. Full: "spin drive ready · Δv ×N" (#FFC2D2; N is a level / balance number). Burning:
       "spin drive · burning N %/s" (#FF7A9C). Status chips move down by 36 px while the row shows.
       Also: the no-row note 10.5 px #5E6788.
       Tokens: style.md §19 (astro.*). -->
  <defs><linearGradient id="haBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C8285A"/><stop offset="0.7" stop-color="#FF3D6E"/><stop offset="1" stop-color="#FF7A9C"/></linearGradient><pattern id="haCells" width="7" height="8" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="2" r="0.55" fill="#1A0610" fill-opacity="0.75"/><circle cx="4.8" cy="5.6" r="0.5" fill="#1A0610" fill-opacity="0.6"/><circle cx="3.2" cy="3.8" r="0.35" fill="#FFF2F6" fill-opacity="0.5"/></pattern></defs>
  <g id="hudAstrophage"><g transform="translate(20 30)"><text x="0" y="0" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">FUEL</text><text x="220" y="0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">64 %</text><rect x="0" y="8" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="8" width="141" height="8" rx="4" fill="#3DE0C2"/><text x="0" y="36" font-size="10.5" fill="#5E6788">no spin drive fitted: no Astrophage row</text></g><g transform="translate(280 30)"><text x="0" y="0" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">FUEL</text><text x="220" y="0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">64 %</text><rect x="0" y="8" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="8" width="141" height="8" rx="4" fill="#3DE0C2"/><text x="0" y="36" font-size="11" font-weight="500" letter-spacing="1.54" fill="#FF3D6E">ASTROPHAGE</text><text x="220" y="36" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">38 %</text><rect x="0" y="44" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="44" width="83.6" height="8" rx="4" fill="url(#haBar)"/><rect x="0" y="44" width="83.6" height="8" rx="4" fill="url(#haCells)"/><g transform="translate(83.6 48)"><g><animateTransform attributeName="transform" type="scale" values="0.6;1.2;0.6" dur="0.9s" repeatCount="indefinite"/><path d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1 Z" fill="#FFF2F6"/></g></g><rect x="0" y="44" width="83.6" height="8" rx="4" fill="#FFFFFF" fill-opacity="0"><animate attributeName="fill-opacity" values="0;0.25;0" dur="0.9s" repeatCount="indefinite"/></rect><g transform="translate(0 72)"><g transform="translate(0 0)"><rect x="0" y="-11" width="137" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FF3D6E" stroke-opacity="0.75"/><text x="6" y="1" font-size="10.5" fill="#FF3D6E" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">harvesting +2.4 %/s</text></g></g></g><g transform="translate(20 170)"><text x="0" y="0" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">FUEL</text><text x="220" y="0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">64 %</text><rect x="0" y="8" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="8" width="141" height="8" rx="4" fill="#3DE0C2"/><text x="0" y="36" font-size="11" font-weight="500" letter-spacing="1.54" fill="#FF3D6E">ASTROPHAGE</text><text x="220" y="36" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">22 %</text><rect x="0" y="44" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="44" width="48.4" height="8" rx="4" fill="url(#haBar)"/><rect x="0" y="44" width="48.4" height="8" rx="4" fill="url(#haCells)"/><rect x="48.4" y="44" width="88" height="8" rx="0" fill="#FF3D6E" fill-opacity="0.35"/><rect x="48.4" y="44" width="88" height="8" fill="none" stroke="#FFC2D2" stroke-opacity="0.7" stroke-width="0.8" stroke-dasharray="2 2"/><g transform="translate(0 72)"><g transform="translate(0 0)"><rect x="0" y="-11" width="131" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FFC2D2" stroke-opacity="0.75"/><text x="6" y="1" font-size="10.5" fill="#FFC2D2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">+40 % on this path</text></g></g></g><g transform="translate(280 170)"><text x="0" y="0" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">FUEL</text><text x="220" y="0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">64 %</text><rect x="0" y="8" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="8" width="141" height="8" rx="4" fill="#3DE0C2"/><text x="0" y="36" font-size="11" font-weight="500" letter-spacing="1.54" fill="#FF3D6E">ASTROPHAGE</text><text x="220" y="36" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">100 %</text><rect x="0" y="44" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="0" y="44" width="220.0" height="8" rx="4" fill="url(#haBar)"/><rect x="0" y="44" width="220.0" height="8" rx="4" fill="url(#haCells)"/><g transform="translate(0 72)"><g transform="translate(0 0)"><rect x="0" y="-11" width="177" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FFC2D2" stroke-opacity="0.75"/><text x="6" y="1" font-size="10.5" fill="#FFC2D2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">spin drive ready · Δv ×12</text></g></g></g></g>
</svg>
