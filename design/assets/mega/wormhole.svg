<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Wormhole pair (late game), v1.5 rules. ONE group #wormholePair at translate(0 0) (a sample in a 460 x 330 view). Ids: wh*.
       Two linked wormhole mouths (late game). Entrance at (120, 150), r 46; exit at (355, 175), r 34. Each mouth is a window onto the sky at the OTHER
       end: a disc with a radial sky gradient (entrance shows the warm exit side #8A2A4A -> #4A1A3A with #FFD9B0 stars; exit shows the cool entrance side
       #2A5AB8 -> #0E2A5A with #B8CCFF stars), nebula blobs, and stars packed toward the rim (r = R u^0.45: lensing), all turning slowly (360 deg / 120 s).
       Rim: an Einstein ring #FFFFFF a0.85 1.2 px + #B8CCFF a0.45 at R + 2.2, a halo #B8CCFF peak a0.35 to 1.35 R, and 7 short lensed arcs #E9EEF8 a0.6 just outside
       (background stars smeared around the mouth). Planning: a dashed link #8B95B5 between the mouths and an exit clock chip "exit clock +3.2 h".
       Gameplay: entering a mouth (r < R) moves the ship to the other mouth with its speed kept and its heading turned by the pair's angle; the exit adds its
       clock offset to outside time (WP5 scoring). No logos or ring gates: a natural wormhole. Tokens: style.md §13. -->
  <defs><radialGradient id="whASky" cx="0.45" cy="0.45" r="0.6"><stop offset="0" stop-color="#8A2A4A"/><stop offset="1" stop-color="#4A1A3A"/></radialGradient><clipPath id="whAC"><circle cx="120" cy="150" r="46"/></clipPath><radialGradient id="whAHalo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.7" stop-color="#B8CCFF" stop-opacity="0"/><stop offset="0.84" stop-color="#B8CCFF" stop-opacity="0.35"/><stop offset="1" stop-color="#B8CCFF" stop-opacity="0"/></radialGradient><radialGradient id="whBSky" cx="0.45" cy="0.45" r="0.6"><stop offset="0" stop-color="#2A5AB8"/><stop offset="1" stop-color="#0E2A5A"/></radialGradient><clipPath id="whBC"><circle cx="355" cy="175" r="34"/></clipPath><radialGradient id="whBHalo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.7" stop-color="#B8CCFF" stop-opacity="0"/><stop offset="0.84" stop-color="#B8CCFF" stop-opacity="0.35"/><stop offset="1" stop-color="#B8CCFF" stop-opacity="0"/></radialGradient></defs>
