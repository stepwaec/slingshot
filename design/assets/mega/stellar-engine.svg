<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Stellar engine (late game), v1.5 rules. ONE group #stellarEngine at translate(0 0) (a sample in a 460 x 330 view). Ids: se*.
       A star turned into a rocket (late game). Drawn around the level's star - here a placeholder disc at (120, 165), r 25.3 (the sun at scale 0.55);
       the game draws the real star asset and scales this group by star radius / 25.3.
       Parts: 26 mirror collectors (9 x 3.2 tiles, gradient #F4F8FF | #AFC2EE | #5A6E9E, outline #1A2240) on an arc r 62-76 behind the star (angles 110-250 deg);
       a magnetic nozzle (two curved bars #DCE4F6 3 px with #5EA0FF dashed field lines) on the jet side; the JET along +x from r 30 to 360: half-width 4 -> 20
       (w = 4 + 16 t^0.8), crisp ragged edges (two sine terms, 3 shapes cycling every 0.5 s), fill linear along the jet #FFF6D6 | 0.15 #FFD27A a0.95 |
       0.45 #FF9A4A a0.8 | 0.75 #FF5A8A a0.45 | 1 #E0408A a0 - golden-white into hot pink, never brown; a white core #FFFFFF -> #FFF6D6 to 230; three bright knots
       (radial #FFFFFF a0.95 -> #FFE7A0 a0, 18 x 8) streaming out every 4 s.
       Gameplay hooks (level data): the jet core (|offset| < 0.5 w) burns (hull damage, like a hazard); the jet margins (0.6-1.4 w, dashed #FFB45A a0.6
       edges in planning, label "scoop fuel here") refill fuel with the gas scoop; the jet also pushes the ship along +x (a small force). Tokens: style.md §13. -->
  <defs><linearGradient id="seJet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6D6"/><stop offset="0.15" stop-color="#FFD27A" stop-opacity="0.95"/><stop offset="0.45" stop-color="#FF9A4A" stop-opacity="0.8"/><stop offset="0.75" stop-color="#FF5A8A" stop-opacity="0.45"/><stop offset="1" stop-color="#E0408A" stop-opacity="0"/></linearGradient><linearGradient id="seCore" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#FFF6D6" stop-opacity="0.8"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></linearGradient><linearGradient id="seMirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F8FF"/><stop offset="0.5" stop-color="#AFC2EE"/><stop offset="1" stop-color="#5A6E9E"/></linearGradient><radialGradient id="seKnot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient><radialGradient id="seSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
