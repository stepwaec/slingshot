<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Shkadov thruster (late game), v1.5 rules. ONE group #shkadovThruster at translate(0 0) (a sample in a 460 x 330 view). Ids: sk*.
       A star-sized mirror pushing a star (late game). Star placeholder at (270, 165), r 23. The mirror: an arc of radius 86 (inner 80) from
       115 to 245 deg, gradient across #FFFFFF | #E6F2FF | #8FA3D0 (bright on the star side), outline #1A2240, nine struts #5A6E9E outside, and the reflected
       glow #FFE7A0 a0.35 5 px just inside. The escaping light on the open side: 11 crisp rays (-35 .. +35 deg, 2.2 -> 0.95 px) fading #FFF6D6 a0.8 -> #FFE7A0 a0
       over 230 px (no flat cone: low-alpha gold over navy reads brown).
       Gameplay: the mirror is solid; the whole system drifts toward the mirror: level data drift { ax, ay } (a tiny constant acceleration) added to every
       body in bodyPose, so orbits stay intact while the frame moves. Planning shows a dashed drift arrow #8B95B5 with "the whole system drifts this way".
       Tokens: style.md §13. -->
  <defs><linearGradient id="skRay" gradientUnits="userSpaceOnUse" x1="270" y1="0" x2="500" y2="0"><stop offset="0" stop-color="#FFF6D6" stop-opacity="0.8"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></linearGradient><linearGradient id="skMirror" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#E6F2FF"/><stop offset="1" stop-color="#8FA3D0"/></linearGradient><radialGradient id="skSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
  <g id="shkadovThruster"><line x1="294.6" y1="147.8" x2="458.4" y2="33.1" stroke="url(#skRay)" stroke-width="0.95"/><line x1="296.5" y1="150.9" x2="473.1" y2="57.0" stroke="url(#skRay)" stroke-width="1.20"/><line x1="298.0" y1="154.2" x2="484.7" y2="82.6" stroke="url(#skRay)" stroke-width="1.45"/><line x1="299.1" y1="157.7" x2="493.2" y2="109.4" stroke="url(#skRay)" stroke-width="1.70"/><line x1="299.8" y1="161.3" x2="498.3" y2="137.0" stroke="url(#skRay)" stroke-width="1.95"/><line x1="300.0" y1="165.0" x2="500.0" y2="165.0" stroke="url(#skRay)" stroke-width="2.20"/><line x1="299.8" y1="168.7" x2="498.3" y2="193.0" stroke="url(#skRay)" stroke-width="1.95"/><line x1="299.1" y1="172.3" x2="493.2" y2="220.6" stroke="url(#skRay)" stroke-width="1.70"/><line x1="298.0" y1="175.8" x2="484.7" y2="247.4" stroke="url(#skRay)" stroke-width="1.45"/><line x1="296.5" y1="179.1" x2="473.1" y2="273.0" stroke="url(#skRay)" stroke-width="1.20"/><line x1="294.6" y1="182.2" x2="458.4" y2="296.9" stroke="url(#skRay)" stroke-width="0.95"/><path d="M233.7 242.9 A86 86 0 0 1 233.7 87.1 L236.2 92.5 A80 80 0 0 0 236.2 237.5 Z" fill="url(#skMirror)" stroke="#1A2240" stroke-width="0.8"/><line x1="224.4" y1="237.9" x2="221.8" y2="242.2" stroke="#5A6E9E" stroke-width="1.2"/><line x1="207.6" y1="224.2" x2="204.0" y2="227.6" stroke="#5A6E9E" stroke-width="1.2"/><line x1="194.8" y1="206.7" x2="190.4" y2="209.1" stroke="#5A6E9E" stroke-width="1.2"/><line x1="186.7" y1="186.5" x2="181.9" y2="187.8" stroke="#5A6E9E" stroke-width="1.2"/><line x1="184.0" y1="165.0" x2="179.0" y2="165.0" stroke="#5A6E9E" stroke-width="1.2"/><line x1="186.7" y1="143.5" x2="181.9" y2="142.2" stroke="#5A6E9E" stroke-width="1.2"/><line x1="194.8" y1="123.3" x2="190.4" y2="120.9" stroke="#5A6E9E" stroke-width="1.2"/><line x1="207.6" y1="105.8" x2="204.0" y2="102.4" stroke="#5A6E9E" stroke-width="1.2"/><line x1="224.4" y1="92.1" x2="221.8" y2="87.8" stroke="#5A6E9E" stroke-width="1.2"/><path d="M225.3 228.9 A78 78 0 0 1 225.3 101.1" fill="none" stroke="#FFE7A0" stroke-opacity="0.35" stroke-width="5"/><g transform="translate(270.0 165.0)"><circle r="23.0" fill="url(#skSun)"/><circle r="23.0" fill="none" stroke="#FFF1C2" stroke-opacity="0.8" stroke-width="1.2"/></g><g stroke="#8B95B5" stroke-width="1.2" fill="none"><path d="M180 285 L60 285" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="18" dur="1.5s" repeatCount="indefinite"/></path><path d="M60 285 l9 -6 m-9 6 l9 6" stroke-linecap="round"/></g><text x="60" y="303" font-size="10" fill="#8B95B5">the whole system drifts this way</text></g>
</svg>
