<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Dyson swarm (late game), v1.5 rules. ONE group #dysonSwarm at translate(0 0) (a sample in a 460 x 330 view). Ids: ds*.
       A cloud of solar collectors around a star (late game). Star placeholder at (230, 165), r 25.3, drawn at a0.72 (the swarm dims it);
       the game draws the real star, at opacity 1 - coverage (0.72 here). Draw order: waste-heat ring -> back halves of the shells -> star -> front halves.
       Shells: three tilted orbits, ellipses rx 78 / 104 / 132 with ry = 0.42 / 0.55 / 0.36 rx, rotated -18 / 22 / -4 deg. Collectors are the dashes of a
       3 px stroke #5E8FFF (dash 3 7 / 2.6 8 / 3.2 9) running along each orbit (dash offset animated, 26 / 40 / 60 s per 10 dash cycles - inner faster,
       like Kepler); gold glints #FFE7A0 every 3rd dash cycle where a collector catches the light. Waste heat: an annulus r 88-160, #A8303A peak a0.16
       (radial #8A2A3A a0 at 0.55 | #A8303A a0.16 at 0.75 | a0 at 1) - the infrared glow a real swarm gives off.
       Gameplay hooks: solar recharge x (1 - coverage) (x0.4 here); each shell is a band 6 px wide where a collector hit costs a little hull (not a crash);
       the gaps between shells are safe lanes to weave through. Tokens: style.md §13. -->
  <defs><radialGradient id="dsHeat" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#8A2A3A" stop-opacity="0"/><stop offset="0.75" stop-color="#A8303A" stop-opacity="0.16"/><stop offset="1" stop-color="#8A2A3A" stop-opacity="0"/></radialGradient><radialGradient id="dsSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
