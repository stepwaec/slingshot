<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Space elevator (late game), v1.5 rules. ONE group #spaceElevator at translate(0 0) (a sample in a 460 x 330 view). Ids: el*.
       A tether from a planet to a counterweight (late game). Planet placeholder at (120, 200), r 34 (the home planet). The elevator co-rotates with
       the planet (here it sits at -28 deg and swings to -34 and back over 30 s for the sample; in the game its angle is the planet's spin angle). Parts along the tether:
       tether #DCE4F6 1.2 px over a #5EA0FF a0.35 3 px glow, from the surface (r 34) to the counterweight (r 270); a station at r 150 (disc r 6 #1A2240,
       rim #DCE4F6, ring r 10 #AFC2EE, beacon #5EF2FF); the counterweight rock (#62584E, dock light #FFD9B0); climbers 4 x 3.6 #FFE08A riding up and down
       (12 s / 9 s). At the top a release arrow #3DE0C2 (dashed, tangent to the rotation) and a chip "free dv 2.4".
       Gameplay: the tether is solid (thin crash line); a ship docked at the counterweight and released leaves with v = omega x r (tangential), its free
       launch boost, shown in planning by the release arrow. Tokens: style.md §13. -->
  <defs><radialGradient id="elPlanet" cx="0.65" cy="0.35" r="0.7"><stop offset="0" stop-color="#A8DBFF"/><stop offset="0.5" stop-color="#1E5BD6"/><stop offset="1" stop-color="#08122E"/></radialGradient></defs>
  <g id="spaceElevator"><g transform="translate(120 200) rotate(-28)"><animateTransform attributeName="transform" type="rotate" values="0;-6;0" dur="30s" repeatCount="indefinite" additive="sum"/><line x1="34" y1="0" x2="270" y2="0" stroke="#DCE4F6" stroke-width="1.2"/><line x1="34" y1="0" x2="270" y2="0" stroke="#5EA0FF" stroke-opacity="0.35" stroke-width="3"/><g transform="translate(150 0)"><circle r="6" fill="#1A2240" stroke="#DCE4F6" stroke-width="1.2"/><circle r="10" fill="none" stroke="#AFC2EE" stroke-width="1"/><circle r="1.5" fill="#5EF2FF"/></g><g transform="translate(270 0)"><path d="M-7 -5 L6 -6 L9 1 L4 7 L-6 6 L-9 0 Z" fill="#62584E" stroke="#0C0B12" stroke-width="0.6"/><circle cx="2" cy="-1" r="1.2" fill="#FFD9B0"/></g><rect x="-2" y="-1.8" width="4" height="3.6" rx="0.8" fill="#FFE08A"><animateMotion path="M34 0 L262 0" dur="12s" begin="0s" repeatCount="indefinite"/></rect><rect x="-2" y="-1.8" width="4" height="3.6" rx="0.8" fill="#FFE08A"><animateMotion path="M34 0 L262 0" dur="12s" begin="-5s" repeatCount="indefinite"/></rect><rect x="-2" y="-1.8" width="4" height="3.6" rx="0.8" fill="#FFE08A"><animateMotion path="M262 0 L34 0" dur="9s" begin="-2s" repeatCount="indefinite"/></rect><g stroke="#3DE0C2" stroke-width="1.4" fill="none"><path d="M270 -8 L270 -70" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></path><path d="M270 -70 l-6 9 m6 -9 l6 9" stroke-linecap="round"/></g><g transform="translate(280 -50) rotate(28)"><rect x="0" y="-11" width="74" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.85" stroke="#3DE0C2" stroke-opacity="0.6"/><text x="6" y="1" font-size="10.5" fill="#3DE0C2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">free Δv 2.4</text></g></g><g transform="translate(120 200)"><circle r="34" fill="url(#elPlanet)"/></g><text x="260" y="300" font-size="10" fill="#8B95B5">co-rotates with the planet; release at the top</text></g>
</svg>
