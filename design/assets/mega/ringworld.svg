<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Ringworld (late game), v1.5 rules. ONE group #ringworld at translate(0 0) (a sample in a 460 x 330 view). Ids: rw*.
       A ring around its star (late game), drawn slightly tilted so its inner floor shows: ellipse rx 210 ry 62 (tilt cos 0.295), band height 13,
       centred on a star placeholder at (230, 164), r 23. Draw order: far half (inner floor: land #5FA84A / forest #3B7E3A / sea #1E5BD6 / shallows #36B9D8 /
       desert #E8A85C strips drifting 60 px per 120 s, clouds #FFFFFF a0.7; night patches #050B1E a0.65 from the shadow squares) -> rim lines #DCE4F6 ->
       star -> five shadow squares (#1A2240, rim #5A6E9E) orbiting on an inner ellipse in 40 s -> near half (outer hull #141A33 with ribs #2A3560 and
       city lights #FFD9B0) -> near rims #AFC2EE / #5A6E9E.
       Gameplay: in the top-down sim the ring is a circle of radius R in the plane; the band is solid except at the transit gaps the level defines
       (draw a gap as a break in both halves with #DCE4F6 end caps). Inside a uniform ring its gravity cancels at the centre (and pulls outward
       elsewhere), so the star dominates. Tokens: style.md §13. -->
  <defs><clipPath id="rwFar"><path d="M20 170 A210 62 0 0 1 440 170 L440 157 A210 62 0 0 0 20 157 Z"/></clipPath><clipPath id="rwNear"><path d="M20 170 A210 62 0 0 0 440 170 L440 157 A210 62 0 0 1 20 157 Z"/></clipPath><radialGradient id="rwSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
