<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120">
  <!-- Launch drag arrow at 62 % power. Ship at the left (centre 36,92), launch direction up-right (-18°).
       Same geometry as mockups/planning.svg and canvas-notes.md §9, measured from the ship centre along the
       launch direction with Lmax = 242 px, so the power tick T sits at 150 for 62 %:
         ghost  16 → 258  #FFFFFF α 0.16, 1 px, dash 1 5, round caps  (the 100 % extent)
         shaft  16 → 152  #FFFFFF α 0.9, 2 px, round caps            (tucks 2 px under the head)
         head   tip (166,0), base (150,±6), fill + 1 px stroke in the power colour
         tick   (150,-11) → (150,11), 1.5 px, power colour
       Power colour at 62 % is #FFAE59 (arrow.power ramp, t = 0.24 between #FFC857 and #FF5A5F).
       Label "62 %" 12 px mono in ui.textMuted #8B95B5 (never the power colour), unrotated, baseline-left at
       tip + (2, 25) screen px: tip (193.9, 40.7) → (196, 66). -->
  <!-- ship: assets/ship.svg geometry (24-unit space, anchor 12,12), nose along the launch direction -->
  <g transform="translate(36 92) rotate(72) translate(-12 -12)">
    <g stroke="#0A0D1A" stroke-width="1" stroke-linejoin="round">
      <polygon fill="#F2F5FF" points="8.2,12.5 4,19.2 7,19.6"/>
      <polygon fill="#F2F5FF" points="15.8,12.5 20,19.2 17,19.6"/>
      <polygon fill="#F2F5FF" points="12,2 18.5,21 12,16.5 5.5,21"/>
    </g>
    <rect x="11.2" y="7.5" width="1.6" height="4" rx="0.8" fill="#5EA0FF"/>
  </g>
  <g transform="translate(36 92) rotate(-18)">
    <!-- ghost: 100 % extent -->
    <line x1="16" y1="0" x2="258" y2="0" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="1 5" stroke-linecap="round"/>
    <!-- shaft to 62 % -->
    <line x1="16" y1="0" x2="152" y2="0" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2" stroke-linecap="round"/>
    <!-- head: 16 px, power colour -->
    <polygon fill="#FFAE59" stroke="#FFAE59" stroke-width="1" stroke-linejoin="round" points="166,0 150,-6 150,6"/>
    <!-- power tick: 1.5 px, power colour -->
    <line x1="150" y1="-11" x2="150" y2="11" stroke="#FFAE59" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <text x="196" y="66" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8B95B5">62 %</text>
</svg>
