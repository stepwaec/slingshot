<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Event telegraphs (Living universe LU3), v1.5 rules. ONE group #eventTelegraphs at translate(0 0) (a sample in a 460 x 330 view). Ids: tg*.
       How every scripted event shows in planning before it happens (LU3). Planet placeholder at (120, 200), r 37.4; the comet at (420, 30).
       Collision course: a dashed #FF9F43 1.4 px line (dash 5 5, crawling 13 px/s) from the comet to the impact point. Impact reticle: circle r 9 <-> 12
       (1.2 s) with four ticks, #FF9F43 1.4 px. Countdown chip "impact in 0:42" (#FF9F43 border and text on the panel fill). The follow-on: the debris
       forecast as two dashed #FFC857 a0.7 edges along the orbit, with "debris from 0:42 for 1:30" (#FFC857). Rule: the warning colour #FF9F43 marks the
       event itself, #FFC857 what follows from it; never a tinted fill (low-alpha orange over navy reads brown). Tokens: style.md §14. -->
  <defs><radialGradient id="tgPlanet" cx="0.65" cy="0.35" r="0.7"><stop offset="0" stop-color="#A8DBFF"/><stop offset="0.5" stop-color="#1E5BD6"/><stop offset="1" stop-color="#08122E"/></radialGradient></defs>
  <g id="eventTelegraphs"><g transform="translate(120 200) scale(1.1)"><circle r="34" fill="url(#tgPlanet)"/></g><g transform="translate(420 30)"><circle r="6" fill="#9DF7D6" fill-opacity="0.45"/><circle r="2.2" fill="#F0E2CC"/><path d="M0 0 L22 -18 L28 -10 Z" fill="#7FD8FF" fill-opacity="0.45"/></g><path d="M414 35 Q326 136 152.4 181.3" fill="none" stroke="#FF9F43" stroke-width="1.4" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/></path><g transform="translate(152.4 181.3)" stroke="#FF9F43" stroke-width="1.4" fill="none"><circle r="9"><animate attributeName="r" values="9;12;9" dur="1.2s" repeatCount="indefinite"/></circle><path d="M-14 0 L-6 0 M6 0 L14 0 M0 -14 L0 -6 M0 6 L0 14"/></g><g transform="translate(170.389350101538 171.3)"><rect x="0" y="-11" width="104" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FF9F43" stroke-opacity="0.7"/><text x="6" y="1" font-size="10.5" fill="#FF9F43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">impact in 0:42</text></g><path d="M158 161 Q272 73 388 145 M166 183 Q272 109 378 175" fill="none" stroke="#FFC857" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="3 5"/><g transform="translate(272.389350101538 211.3)"><rect x="0" y="-11" width="177" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FFC857" stroke-opacity="0.7"/><text x="6" y="1" font-size="10.5" fill="#FFC857" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">debris from 0:42 for 1:30</text></g><text x="20" y="312" font-size="10" fill="#8B95B5">scripted, deterministic: prediction knows exactly when and where</text></g>
</svg>
