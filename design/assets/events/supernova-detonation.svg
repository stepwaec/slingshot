<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Supernova detonation (WP12), v1.5 rules. ONE group #supernovaDetonation at translate(0 0) (a sample in a 460 x 330 view). Ids: sd*.
       The moment of a supernova (WP12): `supernova.at`, played on sim time. The sample loops 6 s with the event at 2 s. The star (placeholder disc for the
       red-giant asset) shrinks 0.38 -> 0.30 in the last 0.5 s and vanishes at `at`. The flash: radial #FFFFFF | 0.25 #E6F4FF a0.95 | 0.6 #9FC4FF a0.35 |
       1 #7FB8FF a0 (event.novaFlash), r 10 -> 260 over 0.85 s then to 300, a1 -> 0.6 -> 0 over 2.6 s - blue-white, the hottest light in the game.
       The ejecta shell: a #BFEFFF 2 px ring with 46 filaments (#FF5A6A / #FFB45A / #3DE0C2, 6-16 px, 1.4 px) growing from 6 to 144 px in 1.2 s and on at
       `supernova.speed` (here to 2.4 x over 4 s). In the game the flash peaks at 1.2 x `blast` and the shell sits exactly at
       shellRadius(nova, t) = speed (t - at); the sample's radii are illustrative. A neutron star (radial #FFFFFF | #DCF6FF | #7FDBFF a0) stays at the centre. Tokens: style.md §16. -->
  <defs><radialGradient id="sdFlash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.25" stop-color="#E6F4FF" stop-opacity="0.95"/><stop offset="0.6" stop-color="#9FC4FF" stop-opacity="0.35"/><stop offset="1" stop-color="#7FB8FF" stop-opacity="0"/></radialGradient><radialGradient id="sdPuls" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#DCF6FF"/><stop offset="1" stop-color="#7FDBFF" stop-opacity="0"/></radialGradient><radialGradient id="sdGiant" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF8A42"/><stop offset="0.65" stop-color="#F0602C"/><stop offset="1" stop-color="#C8401E"/></radialGradient></defs>
  <g id="supernovaDetonation"><g transform="translate(230 170)"><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.33;0.36;1" dur="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="0.38;0.38;0.30;0.30" keyTimes="0;0.25;0.34;1" dur="6s" repeatCount="indefinite"/><circle r="120" fill="url(#sdGiant)"/><circle r="120" fill="none" stroke="#FFC8A0" stroke-opacity="0.8" stroke-width="2.4"/></g></g><circle cx="230" cy="170" r="10" fill="url(#sdFlash)" opacity="0"><animate attributeName="r" values="10;10;260;300" keyTimes="0;0.34;0.48;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0.6;0" keyTimes="0;0.335;0.36;0.5;0.8" dur="6s" repeatCount="indefinite"/></circle><g transform="translate(230 170)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.4;0.9;1" dur="6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="scale" values="0.1;0.1;1;2.4" keyTimes="0;0.35;0.55;1" dur="6s" repeatCount="indefinite"/><circle r="60" fill="none" stroke="#BFEFFF" stroke-width="2"/><line x1="8.5" y1="57.4" x2="9.5" y2="70.9" stroke="#FF5A6A" stroke-width="1.4" stroke-linecap="round"/><line x1="56.4" y1="-13.6" x2="67.4" y2="-15.8" stroke="#FFB45A" stroke-width="1.4" stroke-linecap="round"/><line x1="40.7" y1="41.4" x2="51.5" y2="51.6" stroke="#3DE0C2" stroke-width="1.4" stroke-linecap="round"/><line x1="-16.3" y1="-55.7" x2="-19.7" y2="-64.4" stroke="#FFB45A" stroke-width="1.4" stroke-linecap="round"/><line x1="49.9" y1="29.6" x2="59.6" y2="35.2" stroke="#FF5A6A" stroke-width="1.4" stroke-linecap="round"/><line x1="0.9" y1="58.0" x2="1.2" y2="72.6" stroke="#3DE0C2" stroke-width="1.4" stroke-linecap="round"/><line x1="58.0" y1="-0.3" x2="69.4" y2="-0.4" stroke="#FF5A6A" stroke-width="1.4" stroke-linecap="round"/><line x1="14.6" y1="56.1" x2="16.9" y2="64.1" stroke="#FF5A6A" stroke-width="1.4" stroke-linecap="round"/><line x1="-36.4" y1="-4