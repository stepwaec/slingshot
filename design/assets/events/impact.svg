<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Impact (Living universe LU3), v1.5 rules. ONE group #impactEvent at translate(0 0) (a sample in a 460 x 330 view). Ids: im*.
       A comet hits a planet (Living universe LU3). Planet placeholder at (200, 190), r 49.3 (the home planet at x1.45); impact point on the limb at -38 deg.
       The sample loops 6 s; in the game the impact happens at its scripted sim step t0 and plays once:
         approach  t0 - 2.4 s .. t0: the comet (nucleus #F0E2CC, coma #9DF7D6 a0.45, ion tail #7FD8FF a0.5) on its collision course.
         flash     t0 .. +0.6 s: radial #FFFFFF | 0.35 #FFF6D6 a0.9 | 1 #FFE7A0 a0 (event.flash), r 4 -> 34, a1 -> 0 by +0.9 s.
         shock     t0 .. +1.3 s: ring #FFE7A0 1.6 px, r 6 -> 80, fading.  Rim flash: planet rim #FFE7A0 2 px, a0.7 decaying over 1.8 s.
         ejecta    t0 .. +2.7 s: 20 particles in a +-35 deg cone along the surface normal, 40-120 px, ease-out (they slow down), 1/3 hot #FFB45A, the rest rock
                   #C8A684 / #9A7A5E / #8E8478, r 1-2.2, fading.
         afterglow t0 .. +3.6 s: crater glow radial #FFE7A0 | 0.4 #FF8A3A a0.85 | 1 #FF6A2A a0 (event.glow), r 9, a1 -> 0.6 at +2 s -> 0.
       Then the debris field (debris-field.svg) takes over in the sim. Tokens: style.md §14. -->
  <defs><radialGradient id="imFlash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#FFF6D6" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient><radialGradient id="imGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7A0"/><stop offset="0.4" stop-color="#FF8A3A" stop-opacity="0.85"/><stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/></radialGradient><radialGradient id="imPlanet" cx="0.65" cy="0.35" r="0.7"><stop offset="0" stop-color="#A8DBFF"/><stop offset="0.5" stop-color="#1E5BD6"/><stop offset="1" stop-color="#08122E"/></radialGradient></defs>
  <g id="impactEvent"><g transform="translate(200 190) scale(1.45)"><circle r="34" fill="url(#imPlanet)"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.39;0.4;1" dur="6s" repeatCount="indefinite"/>
  <g><animateMotion path="M420 18 L238.8 159.6" keyPoints="0;1;1" keyTimes="0;0.4;1" dur="6s" repeatCount="indefinite"/>
