<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Accretion (Living universe LU3), v1.5 rules. ONE group #accretionEvent at translate(0 0) (a sample in a 460 x 330 view). Ids: ac*.
       A star pulled into a black hole (LU3). Black hole at (140, 180), shadow r 16, disk as in tidal-disruption.svg with three dashed rings turning
       (#FFF6D6 a0.5, dash 6 10, 3 / 5 / 8 s - inner faster). The star placeholder at (370, 140), stretched 1.12 toward the hole; a stream of 6 strands from its
       near side (linear #FFB43A -> #FF8A3A a0.9 -> #FFE7A0) arcing into the disk, #FFF6D6 particles flowing (2.6-4.1 s), and a hotspot (event.flash) where it
       meets the disk, flickering 0.9 s. Chip: "mass falling in · gravity shifts" (#FFC857): the star's mass moves into the hole over the event, so the
       gravity field changes on a schedule the prediction knows. Tokens: style.md §14. -->
  <defs><radialGradient id="acFlash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#FFF6D6" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient><radialGradient id="acDisk" cx="0.5" cy="0.5" r="0.5"><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.42" stop-color="#E6F4FF"/><stop offset="0.55" stop-color="#FFE7A0" stop-opacity="0.95"/><stop offset="0.75" stop-color="#FF8A3A" stop-opacity="0.75"/><stop offset="1" stop-color="#A8303A" stop-opacity="0"/></radialGradient><clipPath id="acFront"><rect x="76" y="180" width="128" height="32"/></clipPath><linearGradient id="acStream" gradientUnits="userSpaceOnUse" x1="342" y1="146" x2="190" y2="174"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.5" stop-color="#FF8A3A" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A0"/></linearGradient><radialGradient id="acSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
  <g id="accretionEvent"><ellipse cx="140" cy="180" rx="54.4" ry="16.0" fill="url(#acDisk)"/><ellipse cx="140" cy="180" rx="30" ry="9" fill="none" stroke="#FFF6D6" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="3s" repeatCount="indefinite"/></ellipse><ellipse cx="140" cy="180" rx="40" ry="12" fill="none" stroke="#FFF6D6" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="5s" repeatCount="indefinite"/></ellipse><ellipse cx="140" cy="180" rx="50" ry="15" fill="none" stroke="#FFF6D6" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="8s" repeatCount="indefinite"/></ellipse><circle cx="140" cy="180" r="16" fill="#000000"/><circle cx="140" cy="180" r="17.4" fill="none" stroke="#FFC857" stroke-width="2" stroke-opacity="0.85"/><circle cx="140" cy="180" r="17.4" fill="none" stroke="#FFFFFF" stroke-width="1"/><g transform="translate(370 140) rotate(160) scale(1.12 1)"><circle r="25.3" fill="url(#acSun)"/><circle r="25.3" fill="none" stroke="#FFF1C2" stroke-opacity="0.8" stroke-width="1.2"/></g><path id="acS0" d="M342 144.7 C260 155.5 270 105.5 188 170.2" fill="none" stroke="url(#acStream)" stroke-width="0.85" stroke-opacity="0.53" stroke-linecap="round"/><path id="acS1" d="M342 145.2 C260 157.3 270 107.3 188 170.9" fill="none" stroke="url(#acStream)" stroke-width="1.15" stroke-opacity="0.68" stroke-linecap="round"/><path id="acS2" d="M342 145.7 C260 159.1 270 109.1 188 171.6" fill="none" stroke="url(#acStream)" stroke-width="1.45" stroke-opacity="0.83" stroke-linecap="round"/><path id="acS3" d="M342 146.3 C260 160.9 270 110.9 188 172.4" fill="none" stroke="url(#acStream)" stroke-width="1.45" stroke-opacity="0.83" stroke-linecap="round"/><path id="acS4" d="M342 146.8 C260 162.7 270 112.7 188 173.1" fill="none" stroke="url(#acStream)" stroke-width="1.15" stroke-opacity="0.68" stroke-linecap="round"/><path id="acS5" d="M342 147.3 C260 164.5 270 114.5 188 173.8" fill="none" stroke="url(#acStream)" stroke-width="0.85" stroke-opacity="0.53" stroke-linecap="round"/><circle r="1.4" fill="#FFF6D6"><animateMotion dur="2.6s" begin="0.0s" repeatCount="indefinite"><mpath href="#acS0"/></animateMotion></circle><circle r="1.4" fill="#FFF6D6"><animateMotion dur="2.9s" begin="-0.5s" repeatCount="indefinite"><mpath href="#acS1"/></animateMotion></circle><circle r="1.4" fill="#FFF6D6"><animateMotion dur="3.2s" begin="-0.9s" repeatCount="indefinite"><mpath href="#acS2"/></animateMotion></circle><circle r="1.4" fill="#FFF6D6"><animateMotion dur="3.5s" begin="-1.4s" repeatCount="indefinite"><mpath href="#acS3"/></animateMotion></circle><circle r="1.4" fill="#FFF6D6"><animateMotion dur="3.8s" begin="-1.8s" repeatCount="indefinite"><mpath href="#acS4"/></animateMotion></circle><circle r="1.4" fill="#FFF6D6"><animateMotion dur="4.1s" begin="-2.2s" repeatCount="indefinite"><mpath href="#acS5"/></animateMotion></circle><circle cx="188" cy="172" r="6" fill="url(#acFlash)"><animate attributeName="opacity" values="0.7;1;0.7" dur="0.9s" repeatCount="indefinite"/></circle><ellipse cx="140" cy="180" rx="54.4" ry="16.0" fill="url(#acDisk)" clip-path="url(#acFront)"/><g transform="translate(250 270)"><rect x="0" y="-11" width="223" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FFC857" stroke-opacity="0.7"/><text x="6" y="1" font-size="10.5" fill="#FFC857" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">mass falling in · gravity shifts</text></g></g>
</svg>
