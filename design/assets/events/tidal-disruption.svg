<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Tidal disruption (Living universe LU3), v1.5 rules. ONE group #tidalDisruption at translate(0 0) (a sample in a 460 x 330 view). Ids: td*.
       A planet torn apart inside a black hole's Roche limit (LU3). Black hole (shadow r 18 #000000, photon ring #FFC857 2 px + #FFFFFF 1 px at 1.09 r, disk
       radial #E6F4FF | #FFE7A0 | #FF8A3A | #A8303A, rx 3.4 r ry 1.0 r, front half over the shadow) at (110, 175); the planet placeholder stretched toward it
       (scale 1.55 x 0.7 along the line) at (330, 150).
       Bound stream: 9 strands from the planet into the disk, stroke linear from the planet's colours to hot (#5FA84A -> #36B9D8 -> #FFB45A -> #FFF6D6), with
       #FFE7A0 particles flowing along them (3-6 s) and a hotspot (event.glow) flickering at the disk entry (1.3 s). Unbound tail: 7 strands flung outward in
       the planet's colour (#5FA84A a0.55 fading). Planning chip: "Roche limit crossed". Tokens: style.md §14. -->
  <defs><radialGradient id="tdGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE7A0"/><stop offset="0.4" stop-color="#FF8A3A" stop-opacity="0.85"/><stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/></radialGradient><linearGradient id="tdStream" gradientUnits="userSpaceOnUse" x1="330" y1="150" x2="110" y2="170"><stop offset="0" stop-color="#5FA84A"/><stop offset="0.25" stop-color="#36B9D8"/><stop offset="0.6" stop-color="#FFB45A"/><stop offset="1" stop-color="#FFF6D6"/></linearGradient><radialGradient id="tdDisk" cx="0.5" cy="0.5" r="0.5"><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.42" stop-color="#E6F4FF"/><stop offset="0.55" stop-color="#FFE7A0" stop-opacity="0.95"/><stop offset="0.75" stop-color="#FF8A3A" stop-opacity="0.75"/><stop offset="1" stop-color="#A8303A" stop-opacity="0"/></radialGradient><clipPath id="tdFront"><rect x="38" y="175" width="144" height="36"/></clipPath><radialGradient id="tdPlanet" cx="0.65" cy="0.35" r="0.7"><stop offset="0" stop-color="#A8DBFF"/><stop offset="0.5" stop-color="#1E5BD6"/><stop offset="1" stop-color="#08122E"/></radialGradient></defs>
  <g id="tidalDisruption"><ellipse cx="110" cy="175" rx="61.199999999999996" ry="18.0" fill="url(#tdDisk)"/><circle cx="110" cy="175" r="18" fill="#000000"/><circle cx="110" cy="175" r="19.6" fill="none" stroke="#FFC857" stroke-width="2" stroke-opacity="0.85"/><circle cx="110" cy="175" r="19.6" fill="none" stroke="#FFFFFF" stroke-width="1"/><g transform="translate(330 150) rotate(-170) scale(1.55 0.7)"><g transform="scale(0.75)"><circle r="34" fill="url(#tdPlanet)"/></g></g><path id="tdS0" d="M308 146.5 C240 181.2 200 226.2 150 184.4" fill="none" stroke="url(#tdStream)" stroke-width="0.60" stroke-opacity="0.30" stroke-linecap="round"/><path id="tdS1" d="M308 147.4 C240 183.4 200 228.4 150 185.0" fill="none" stroke="url(#tdStream)" stroke-width="0.85" stroke-opacity="0.45" stroke-linecap="round"/><path id="tdS2" d="M308 148.2 C240 185.6 200 230.6 150 185.7" fill="none" stroke="url(#tdStream)" stroke-width="1.10" stroke-opacity="0.60" stroke-linecap="round"/><path id="tdS3" d="M308 149.1 C240 187.8 200 232.8 150 186.3" fill="none" stroke="url(#tdStream)" stroke-width="1.35" stroke-opacity="0.75" stroke-linecap="round"/><path id="tdS4" d="M308 150.0 C240 190.0 200 235.0 150 187.0" fill="none" stroke="url(#tdStream)" stroke-width="1.60" stroke-opacity="0.90" stroke-linecap="round"/><path id="tdS5" d="M308 150.9 C240 192.2 200 237.2 150 187.7" fill="none" stroke="url(#tdStream)" stroke-width="1.35" stroke-opacity="0.75" stroke-linecap="round"/><path id="tdS6" d="M308 151.8 C240 194.4 200 239.4 150 188.3" fill="none" stroke="url(#tdStream)" stroke-width="1.10" stroke-opacity="0.60" stroke-linecap="round"/><path id="tdS7" d="M308 152.6 C240 196.6 200 241.6 150 189.0" fill="none" stroke="url(#tdStream)" stroke-width="0.85" stroke-opacity="0.45" stroke-linecap="round"/><path id="tdS8" d="M308 153.5 C240 198.8 200 243.8 150 189.6" fill="none" stroke="url(#tdStream)" stroke-width="0.60" stroke-opacity="0.30" stroke-linecap="round"/><path d="M352 147.1 C400 112.8 440 52.8 480 -7.2" fill="none" stroke="#5FA84A" stroke-width="0.65" stroke-opacity="0.25" stroke-linecap="round"/><path d="M352 148.1 C400 115.2 440 55.2 480 -4.8" fill="none" stroke="#5FA84A" stroke-width="0.90" stroke-opacity="0.35" stroke-linecap="round"/><path d="M352 149.0 C400 117.6 440 57.6 480 -2.4" fill="none" stroke="#5FA84A" stroke-width="1.15" stroke-opacity="0.45" stroke-linecap="round"/><path d="M352 150.0 C400 120.0 440 60.0 480 0.0" fill="none" stroke="#5FA84A" stroke-width="1.40" stroke-opacity="0.55" stroke-linecap="round"/><path d="M352 151.0 C400 122.4 440 62.4 480 2.4" fill="none" stroke="#5FA84A" stroke-width="1.15" stroke-opacity="0.45" stroke-linecap="round"/><path d="M352 151.9 C400 124.8 440 64.8 480 4.8" fill="none" stroke="#5FA84A" stroke-width="0.90" stroke-opacity="0.35" stroke-linecap="round"/><path d="M352 152.9 C400 127.2 440 67.2 480 7.2" fill="none" stroke="#5FA84A" stroke-width="0.65" stroke-opacity="0.25" stroke-linecap="round"/><circle r="1.3" fill="#FFE7A0"><animateMotion dur="3.0s" begin="0.0s" repeatCount="indefinite"><mpath href="#tdS0"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="3.4s" begin="-0.5s" repeatCount="indefinite"><mpath href="#tdS1"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="3.8s" begin="-1.0s" repeatCount="indefinite"><mpath href="#tdS2"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="4.2s" begin="-1.5s" repeatCount="indefinite"><mpath href="#tdS3"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="4.6s" begin="-2.0s" repeatCount="indefinite"><mpath href="#tdS4"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="5.0s" begin="-2.5s" repeatCount="indefinite"><mpath href="#tdS5"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMotion dur="5.4s" begin="-3.0s" repeatCount="indefinite"><mpath href="#tdS6"/></animateMotion></circle><circle r="1.3" fill="#FFE7A0"><animateMo