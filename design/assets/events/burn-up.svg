<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Burning up in a star (Living universe LU3), v1.5 rules. ONE group #burnUp at translate(0 0) (a sample in a 460 x 330 view). Ids: bu*.
       A planet spirals into its star and burns up (LU3; the showcase level). Star placeholder at (160, 165), r 36.8. Planet X (r 8, #17B39C with #B5FFF0)
       rides a decaying spiral (dashed #FF9F43 a0.55 in planning). Its dayside glows toward the star (radial #FFE7A0 a0.95 | #FF8A3A a0.6 | #FF6A2A a0) and an
       ablation tail streams behind it (linear #FFF6D6 | #FFB45A a0.9 | #FF5A8A a0.45 | #E0408A a0, 90 long, flickering 0.4 s) - length and glow grow as
       the orbit decays (heat = 1 - (r - R_star) / (r0 - R_star)). The sample loops 8 s: the last 70 % of the spiral, then the plunge at the photosphere:
       a flash (event.flash) r 5 -> 26 over 0.55 s, a ripple ring #FFF1C2 1.4 px r 4 -> 70 across the disc over 1.8 s (clipped to the disc), and the star
       brightening #FFE7A0 a0.22 for 1.6 s. Chips: "burns up in 1:42" (#FF9F43), "orbit decaying" (#FFC857). Tokens: style.md §14. -->
  <defs><radialGradient id="buFlash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#FFF6D6" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE7A0" stop-opacity="0"/></radialGradient><linearGradient id="buTail" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FFF6D6"/><stop offset="0.25" stop-color="#FFB45A" stop-opacity="0.9"/><stop offset="0.65" stop-color="#FF5A8A" stop-opacity="0.45"/><stop offset="1" stop-color="#E0408A" stop-opacity="0"/></linearGradient><radialGradient id="buDay" cx="0.5" cy="0.85" r="0.6"><stop offset="0" stop-color="#FFE7A0" stop-opacity="0.95"/><stop offset="0.5" stop-color="#FF8A3A" stop-opacity="0.6"/><stop offset="1" stop-color="#FF6A2A" stop-opacity="0"/></radialGradient><clipPath id="buDisc"><circle cx="160" cy="165" r="37"/></clipPath><radialGradient id="buSun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFB43A"/><stop offset="0.65" stop-color="#FF8F1F"/><stop offset="1" stop-color="#FF7A14"/></radialGradient></defs>
