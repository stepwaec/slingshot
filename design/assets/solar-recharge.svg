<svg xmlns="http://www.w3.org/2000/svg" width="520" height="320" viewBox="0 0 520 320" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Solar recharge indicator (WP10 design; the mechanic lands with the ship systems package). ONE group #solarRecharge at translate(0 0)
       (a sample sheet: the pieces are placed where the game draws them, see notes). Ids: rc*.
       Rate model (design default, tune in level / ship data): rate = rateMax * L * min(1, (Rref / d)^2), d = distance to the star centre,
       Rref = 85 world px for the yellow sun (scale with the star's luminance L: red dwarf 0.4, blue giant 2.5, white dwarf 0.2, red giant 1.5,
       compact objects and black holes 0). Below 8 % of rateMax the panels count as not charging. The Solar panels upgrade raises rateMax.
       Pieces (top to bottom in this sheet):
       A. HUD fuel block, three flight states (canvas-notes §10 position x 1180-1400, label baseline 48, bar 220 x 8 at y 56):
          - not charging   sun glyph at (label x + 44, baseline - 4) as an empty ring r 3, #4B5470 (ui.textDim), 1.2 px
          - charging       glyph lit: disc r 3 + 8 rays r 4.6 -> 6.2, #FFD27A (sun.limb), 1.2 px round caps; a 40 px white-gold shimmer
                           (#FFF6D6 a0 | 0.85 | 0) sweeps the filled part every 1.8 s, clipped to the fill; a 3 px #FFE08A sliver right of the
                           fill pulses a1 -> 0.35 -> 1; the rate "+0.4 %/s" in 11 px mono #FFE08A right-aligned at (1400, 80)
          - close pass     rays to r 7.5 and turning 45 deg per 2 s; shimmer every 0.9 s; rate "+1.6 %/s"
          The shimmer is white-gold, never the deeper #FFC857 of fuel.low, so a low (gold) bar still reads as charging.
       B. HUD fuel block, PLANNING: glyph lit but still; a ghost segment #FFE08A a0.9 from the current fill to the fuel this plan would end
          with (capped at 100 %), under the fill; "+8 % on this path" in 11 px mono #FFE08A at (1400, 80).
       C. Predicted path: each dot whose rate t = rate / rateMax >= 0.08 turns gold: colour = mix(#DCE4FF, #FFD86E, min(1, sqrt(1.6 t))),
          radius 1.5 + 1.3 min(1, 1.4 t), alpha 1 (normal dots stay #DCE4FF r 1.5 a0.7). No band or glow under the dots: low-alpha gold
          over navy reads olive-grey. The end ring keeps its colour; the total gain sits next to it in 12 px mono #FFE08A.
       D. Ship charging (flight only): a ring r 9 -> 18, #FFE08A 1.2 px, alpha 0.75 -> 0 every 1.2 s, over a still disc r 13 #FFE08A a0.12,
          drawn under the ship sprite.
       Tokens: style.md §8 WP10 (solar.*). -->
  <defs>
    <linearGradient id="rcShimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF6D6" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF6D6" stop-opacity="0.85"/><stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/></linearGradient>
  </defs>
