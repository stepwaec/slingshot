<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Modular ship: base hull (ship systems). ONE group #shipHull at translate(48 64). Ids: sxBase*.
       Shared ship frame: viewBox 0 0 96 160, ship centre at (48, 64), nose UP (-y) at local y -26, tail at +22.6. Every ship part uses this frame, so parts stack exactly: translate(48 64) on each file's one top-level group. Base hull length 48.6 units = 22 px at zoom 1 (scale 0.453, theme.ship.lengthAtZoom1); minimum 12 px. Lighting is symmetric (bright ridge, cooler edges), so the sprite can rotate with the heading.
       Draw order for a build: 1 back modules (solar, tanks, plating back) -> 2 engine plume -> 3 fins + engine nozzle + hull (hull-base) -> 4 front modules (plating front, cryo, scoop, sensors, shield) -> 5 one damage overlay. 
       Layer 3. Fins (blue tips #5EA0FF), hull (gradient #B9C6E4 | 0.3 #E9EEF9 | 0.5 #FFFFFF | 0.7 #E9EEF9 | 1 #B9C6E4, outline #0A0D1A 1 unit), panel lines #0A0D1A α 0.32 0.5 units, accent chevron #5EA0FF 1.1, canopy (radial #CFE8FF | 0.45 #5EA0FF | 1 #1E4FB8) with highlight #FFFFFF α 0.75, engine mount 8 × 2.6 at y 20 (steel #8496C4 | #DCE4F6 | #8496C4). Engines attach at the mount: their nozzles start at y 21.8-22.4.
       Tokens: style.md §8 Ship systems (ship.*). -->
  <defs>
    <linearGradient id="sxBaseHull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C6E4"/><stop offset="0.3" stop-color="#E9EEF9"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E9EEF9"/><stop offset="1" stop-color="#B9C6E4"/></linearGradient>
    <radialGradient id="sxBaseCanopy" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#CFE8FF"/><stop offset="0.45" stop-color="#5EA0FF"/><stop offset="1" stop-color="#1E4FB8"/></radialGradient>
    <linearGradient id="sxBaseSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8496C4"/><stop offset="0.5" stop-color="#DCE4F6"/><stop offset="1" stop-color="#8496C4"/></linearGradient>
  </defs>
  <g id="shipHull" transform="translate(48 64)">
    <path d="M7.2 5 L14.5 16.5 L14.5 21 L6.2 18.5 Z" fill="url(#sxBaseHull)" stroke="#0A0D1A" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M -7.2 5 L -14.5 16.5 L -14.5 21 L -6.2 18.5 Z" fill="url(#sxBaseHull)" stroke="#0A0D1A" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M12.5 16.6 L14.5 16.6 L14.5 21 L12.5 20.3 Z" fill="#5EA0FF"/><path d="M-12.5 16.6 L-14.5 16.6 L-14.5 21 L-12.5 20.3 Z" fill="#5EA0FF"/>
    <path d="M0 -26 C3 -24 5.5 -18 6.5 -12 L7.5 6 L6 18 L3 21 L-3 21 L-6 18 L-7.5 6 L-6.5 -12 C-5.5 -18 -3 -24 0 -26 Z" fill="url(#sxBaseHull)" stroke="#0A0D1A" stroke-width="1" stroke-linejoin="round"/>
    <g stroke="#0A0D1A" stroke-opacity="0.32" stroke-width="0.5" fill="none"><path d="M-7.1 -3 L7.1 -3"/><path d="M-7.3 10 L7.3 10"/><path d="M0 -4 L0 20"/><path d="M-5.6 -16 L5.6 -16"/></g>
    <path d="M-4.6 -6.5 L0 -4.6 L4.6 -6.5" fill="none" stroke="#5EA0FF" stroke-width="1.1" stroke-linecap="round"/>
    <ellipse cx="0" cy="-14.5" rx="2.6" ry="5.4" fill="url(#sxBaseCanopy)" stroke="#0A0D1A" stroke-width="0.7"/><ellipse cx="-0.8" cy="-16.8" rx="0.8" ry="1.8" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="-4" y="20" width="8" height="2.6" rx="0.8" fill="url(#sxBaseSteel)" stroke="#0A0D1A" stroke-width="0.7"/>
  </g>
</svg>
