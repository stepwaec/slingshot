<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Modular ship: Gas scoop module. ONE group #shipModScoop at translate(48 64). Ids: sxMg*.
       Shared ship frame: viewBox 0 0 96 160, ship centre at (48, 64), nose UP (-y) at local y -26, tail at +22.6. Every ship part uses this frame, so parts stack exactly: translate(48 64) on each file's one top-level group. Base hull length 48.6 units = 22 px at zoom 1 (scale 0.453, theme.ship.lengthAtZoom1); minimum 12 px. Lighting is symmetric (bright ridge, cooler edges), so the sprite can rotate with the heading.
       Draw order for a build: 1 back modules (solar, tanks, plating back) -> 2 engine plume -> 3 fins + engine nozzle + hull (hull-base) -> 4 front modules (plating front, cryo, scoop, sensors, shield) -> 5 one damage overlay. 
       Front. Two forward intakes on the shoulders, funnel from y -6 to -13.5, steel, mouth #1A2240 with an amber rim #FFB45A 1 unit. While scooping, pulse the rims #FFB45A α 1 -> 0.4 at 1 Hz.
       Tokens: style.md §8 Ship systems (ship.*). -->
  <defs>
    <linearGradient id="sxMgSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8496C4"/><stop offset="0.5" stop-color="#DCE4F6"/><stop offset="1" stop-color="#8496C4"/></linearGradient>
  </defs>
  <g id="shipModScoop" transform="translate(48 64)">
    <g id="shipModScoopFront">
    <path d="M5.2 -6 L8.6 -6 L10.6 -13.5 L4.4 -13.5 Z" fill="url(#sxMgSteel)" stroke="#0A0D1A" stroke-width="0.8" stroke-linejoin="round"/><ellipse cx="7.5" cy="-13.5" rx="3.1" ry="1" fill="#1A2240" stroke="#FFB45A" stroke-width="1"/>
    <path d="M-5.2 -6 L-8.6 -6 L-10.6 -13.5 L-4.4 -13.5 Z" fill="url(#sxMgSteel)" stroke="#0A0D1A" stroke-width="0.8" stroke-linejoin="round"/><ellipse cx="-7.5" cy="-13.5" rx="3.1" ry="1" fill="#1A2240" stroke="#FFB45A" stroke-width="1"/>
    </g>
  </g>
</svg>
