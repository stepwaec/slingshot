<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Modular ship: pulse engine, firing. ONE group #shipEnginePulse at translate(48 64). Ids: sxEp*.
       Shared ship frame: viewBox 0 0 96 160, ship centre at (48, 64), nose UP (-y) at local y -26, tail at +22.6. Every ship part uses this frame, so parts stack exactly: translate(48 64) on each file's one top-level group. Base hull length 48.6 units = 22 px at zoom 1 (scale 0.453, theme.ship.lengthAtZoom1); minimum 12 px. Lighting is symmetric (bright ridge, cooler edges), so the sprite can rotate with the heading.
       Draw order for a build: 1 back modules (solar, tanks, plating back) -> 2 engine plume -> 3 fins + engine nozzle + hull (hull-base) -> 4 front modules (plating front, cryo, scoop, sensors, shield) -> 5 one damage overlay. 
       Layers 2-3. Pusher plate (arc 22 wide at y 31.5-33.4) on two struts. #sxEpPlume: a flash every 0.6 s (radial #FFFFFF | 0.35 #E2D4FF α 0.9 | 0.7 #A06BFF α 0.45 | 1 #7A4AD8 α 0) growing rx 5 -> 17, ry 3 -> 11 and falling y 36 -> 46 while fading, plus a plate glow #C8B8FF α 0.9 -> 0.3. Powerful, thirsty: one flash per fuel pulse.
       Tokens: style.md §8 Ship systems (ship.*). -->
  <defs>
    <linearGradient id="sxEpSteel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8496C4"/><stop offset="0.5" stop-color="#DCE4F6"/><stop offset="1" stop-color="#8496C4"/></linearGradient>
    <radialGradient id="sxEpPulse" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.35" stop-color="#E2D4FF" stop-opacity="0.9"/><stop offset="0.7" stop-color="#A06BFF" stop-opacity="0.45"/><stop offset="1" stop-color="#7A4AD8" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="shipEnginePulse" transform="translate(48 64)">
    <g id="sxEpPlume"><ellipse cx="0" cy="40" rx="6" ry="4" fill="url(#sxEpPulse)" opacity="0"><animate attributeName="rx" values="5;17" dur="0.6s" repeatCount="indefinite"/><animate attributeName="ry" values="3;11" dur="0.6s" repeatCount="indefinite"/><animate attributeName="cy" values="36;46" dur="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.6s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="0" cy="34" rx="9" ry="2.2" fill="#C8B8FF" opacity="0.5"><animate attributeName="opacity" values="0.9;0.3" dur="0.6s" repeatCount="indefinite"/></ellipse></g>
    <g stroke="#0A0D1A" stroke-width="0.7"><rect x="-4.6" y="22" width="1.6" height="7" fill="url(#sxEpSteel)"/><rect x="3" y="22" width="1.6" height="7" fill="url(#sxEpSteel)"/></g>
    <path d="M-11 31.5 Q0 26.5 11 31.5 L11 33.4 Q0 28.6 -11 33.4 Z" fill="url(#sxEpSteel)" stroke="#0A0D1A" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
