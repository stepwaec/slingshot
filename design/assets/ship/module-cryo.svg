<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Modular ship: Cryosleep module. ONE group #shipModCryo at translate(48 64). Ids: sxMc*.
       Shared ship frame: viewBox 0 0 96 160, ship centre at (48, 64), nose UP (-y) at local y -26, tail at +22.6. Every ship part uses this frame, so parts stack exactly: translate(48 64) on each file's one top-level group. Base hull length 48.6 units = 22 px at zoom 1 (scale 0.453, theme.ship.lengthAtZoom1); minimum 12 px. Lighting is symmetric (bright ridge, cooler edges), so the sprite can rotate with the heading.
       Draw order for a build: 1 back modules (solar, tanks, plating back) -> 2 engine plume -> 3 fins + engine nozzle + hull (hull-base) -> 4 front modules (plating front, cryo, scoop, sensors, shield) -> 5 one damage overlay. 
       Front. A module band 15.2 × 9.2 across the mid hull (hull gradient, outline) with three pod windows 2.4 × 4.8, #BFF4FF, rim #1E6E8A, inner glow #7CF5FF α 0.5 -> 0.15 over 4 s (crew breathing).
       Tokens: style.md §8 Ship systems (ship.*). -->
  <defs>
    <linearGradient id="sxMcHull" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9C6E4"/><stop offset="0.3" stop-color="#E9EEF9"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#E9EEF9"/><stop offset="1" stop-color="#B9C6E4"/></linearGradient>
  </defs>
  <g id="shipModCryo" transform="translate(48 64)">
    <g id="shipModCryoFront">
    <rect x="-7.6" y="-1.6" width="15.2" height="9.2" rx="1.6" fill="url(#sxMcHull)" stroke="#0A0D1A" stroke-width="0.8"/>
    <rect x="-4.8" y="0.6" width="2.4" height="4.8" rx="1" fill="#BFF4FF" stroke="#1E6E8A" stroke-width="0.5"/><rect x="-4.8" y="0.6" width="2.4" height="4.8" rx="1" fill="#7CF5FF" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="-1.2" y="0.6" width="2.4" height="4.8" rx="1" fill="#BFF4FF" stroke="#1E6E8A" stroke-width="0.5"/><rect x="-1.2" y="0.6" width="2.4" height="4.8" rx="1" fill="#7CF5FF" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="2.4" y="0.6" width="2.4" height="4.8" rx="1" fill="#BFF4FF" stroke="#1E6E8A" stroke-width="0.5"/><rect x="2.4" y="0.6" width="2.4" height="4.8" rx="1" fill="#7CF5FF" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/></rect>
    </g>
  </g>
</svg>
