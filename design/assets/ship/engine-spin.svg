<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160">
  <!-- Modular ship: spin drive (Astrophage), firing. ONE group #shipEngineSpin at translate(48 64). Ids: sxEs*.
       Shared ship frame: viewBox 0 0 96 160, ship centre at (48, 64), nose UP (-y) at local y -26, tail at +22.6. Every ship part uses this frame, so parts stack exactly: translate(48 64) on each file's one top-level group. Base hull length 48.6 units = 22 px at zoom 1 (scale 0.453, theme.ship.lengthAtZoom1); minimum 12 px.
       Draw order for a build: 1 back modules (solar, tanks, plating back) -> 2 engine plume -> 3 fins + engine nozzle + hull (hull-base) -> 4 front modules (plating front, cryo, scoop, sensors, shield) -> 5 one damage overlay.
       Layers 2-3. Spin chamber: ellipse 12.4 x 4.8 at y 24.2, #1C2348 edged #0A0D1A; the spin ring #sxEsRing rx 4.4 ry 1.4 #FF3D6E 0.9 px pulsing a0.6 -> 1 over
       0.5 s (idle: a0.4 -> 0.8 over 2 s, no beam); throat #FFF4F7; two struts #8A9AD8. BEAM (#sxEsBeamG): a photon drive, so it is perfectly straight and does not
       spread - 7.2 -> 8.4 wide from y 25.6, linear #FFFFFF | 0.12 #FFD6E0 a0.95 | 0.45 #FF3D6E a0.6 | 0.8 #C0287A a0.22 | 1 a0, heat shimmer (#sxEsHeat:
       fractalNoise 0.05 0.25, displacement 1.6, seed stepping every 0.1 s); a white core #FFFFFF -> #FFF4F7 a0 2 -> 1.2 wide to y 80. In this file the beam ends at
       local y 96 (the frame edge); in the game the beam quad runs to L = 44 + 30 x burn delta-v units (longer than any chemical plume, capped at 160).
       Distinct from the blue-white to violet family (plume.*) on purpose: Astrophage light is crimson. Tokens: style.md §19 (astro.*) and §10. -->
  <defs><linearGradient id="sxEsBeam" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="96"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.12" stop-color="#FFD6E0" stop-opacity="0.95"/><stop offset="0.45" stop-color="#FF3D6E" stop-opacity="0.6"/><stop offset="0.8" stop-color="#C0287A" stop-opacity="0.22"/><stop offset="1" stop-color="#C0287A" stop-opacity="0"/></linearGradient><linearGradient id="sxEsCore" gradientUnits="userSpaceOnUse" x1="0" y1="25" x2="0" y2="80"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.7" stop-color="#FFF4F7" stop-opacity="0.85"/><stop offset="1" stop-color="#FFF4F7" stop-opacity="0"/></linearGradient><filter id="sxEsHeat" x="-200%" y="-5%" width="500%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05 0.25" numOctaves="2" seed="3" result="n"><animate attributeName="seed" values="3;4;5;6;7;8" dur="0.6s" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
  <g id="shipEngineSpin" transform="translate(48 64)"><g id="sxEsBeamG" filter="url(#sxEsHeat)"><path d="M-3.6 25.6 L3.6 25.6 L4.2 96 L-4.2 96 Z" fill="url(#sxEsBeam)"/></g><path d="M-1 25.6 L1 25.6 L0.6 80 L-0.6 80 Z" fill="url(#sxEsCore)"/><ellipse cx="0" cy="24.2" rx="6.2" ry="2.4" fill="#1C2348" stroke="#0A0D1A" stroke-width="0.8"/><ellipse id="sxEsRing" cx="0" cy="24.2" rx="4.4" ry="1.4" fill="none" stroke="#FF3D6E" stroke-width="0.9"><animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="0.5s" repeatCount="indefinite"/></ellipse><ellipse cx="0" cy="24.2" rx="2.2" ry="0.7" fill="#FFF4F7"/><g stroke="#8A9AD8" stroke-width="0.5"><line x1="-6" y1="22" x2="-6" y2="24.2"/><line x1="6" y1="22" x2="6" y2="24.2"/></g></g>
</svg>
