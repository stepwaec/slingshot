<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Ghost markers (Living universe LU2): where a moving body will be. ONE group #ghostMarkers at translate(0 0) (a sample sheet: six states at 2x
       on top, then a tie line and a future track at 1x). Ids: gm* (none needed). Planning and pause only; world-space position from bodyPose at the
       ghost's sim time, screen-space strokes (never scaled with zoom).
       MARKER: a ring at the body's radius (minimum 8 px), 1.2 px, plus an inner ring at 0.62 r, 0.7 px, half the alpha; fill the ghost colour at a0.07-0.14
       (cool colours only, so it never turns brown). Never a filled disc: a ghost must not compete with the real body.
       STATES (ghost.*):
         at a burn     #DCE4FF a0.85 ring; a badge r 6.5 at (0.72 r, -0.72 r): #0A0D1A fill, #B8A8FF 1.4 px ring, the burn number 9 px mono.
         cursor        #FFFFFF 1.6 px ring, fill #DCE4FF a0.12: the moment under the cursor while scrubbing.
         arrival       the target only: #3DE0C2 1.4 px ring, fill a0.10, plus its capture radius dashed 6 6 #3DE0C2 a0.45, crawling 12 px/s.
         collision     #FF5A5F 1.6 px ring pulsing a1 -> 0.45 (0.8 s), fill a0.14, a cross 1.6 px: the path meets the body at that moment.
         gone          #FF9F43 1.2 px dashed 2 3 ring and a slash: the body is consumed or destroyed before that moment (LU3).
         other bodies  moons and planets that are not the target: #DCE4FF a0.6, smaller, no label.
       LABEL: a chip 10.5 px mono beside the ring (r + 8, +4) in the state colour: time from now "+0:51", or "arrive 1:10", "collision 0:48", "gone at 1:42".
       TIE LINE: a dotted line #8B95B5 a0.75 1 px (dash 1.5 3.5, round caps) from the path sample at the same sim time (a ring r 2.6 on the path) to the
       ghost - the pairing is never ambiguous. The cursor's tie line is #FFFFFF a0.85 with a solid r 4 dot on the path.
       FUTURE TRACK: the target's orbit from now to arrival as #3DE0C2 a0.55 dots (dash 1 5, 1.4 px) with a 1 px tick across the track every 10 s of sim time.
       LIMITS: at most one ghost per body per burn node, one cursor ghost, one arrival ghost; ghosts more than 3 burns ahead fade to a0.3.
       Tokens: style.md §15 (ghost.*). -->
