  <!-- Mars (Sol campaign), r 24.8 (ladder 34 sqrt(0.532)). Ids: mar*. Texture strip: period P = round(2 pi r), drawn over 2P with every feature at x and x + P, scrolled through the disc clip (SMIL translate 0 -> +P = west -> east). P = 156, 92 s; start 40 E (Syrtis Major and Hellas in view).
       rust #C8643A with noise (0.12; #E89A66 / #A4502F); dark albedo features #7E3E2A a0.5-0.85 with displaced edges: Syrtis Major, Sinus Sabaeus-Meridiani,
       Tyrrhenum-Cimmerium, Erythraeum, Acidalium, Utopia, Sirenum, Solis Lacus; bright Hellas #F2C49A a0.75 and Argyre #EDBB8E a0.6; Valles Marineris #5E2A1E;
       Olympus Mons and the Tharsis three #E8955E ringed #6E321F; polar caps #F7F2EC beyond 79 N / 82 S (ragged). Thin haze #F5B996 / #FFD9C2 a0.28 / 0.45,
       rim #FFD2B8 / #F29C7A. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       Also: shade highlight #FFE9D6.
       ONE group #mars at translate(31.8 31.8); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
