<svg xmlns="http://www.w3.org/2000/svg" width="72" height="56" viewBox="0 0 72 56">
  <!-- Voyager (Sol campaign easter egg, a probe drifting near the heliopause). Ids: voy*. Game scale (dish 22 px across); preview at 3x.
       High-gain dish ellipse 11 x 4.2, radial #FFFFFF | #E4E8F2 | #8A93B0, rim #5E6788; feed #E4E8F2; decagonal bus #2E2C44 edged #9AA2BE; the golden record
       r 1.3 linear #FFE7A0 | #E9B44C | #B9822E (the hint); magnetometer boom #C9CFDE to (-30, 17); RTG boom to (14, 17) with the RTG #8E8A9E; science
       boom and scan platform #B8BDD0; two radio antennas #DDE2EE. Strokes >= 0.5 px. Not solid (no crash radius).
       Also: RTG outline #3A3650.
       ONE group #voyager at translate(36.0 28.0); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
  <defs><radialGradient id="voyDish" gradientUnits="userSpaceOnUse" cx="3.0" cy="-3.0" r="13.0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4E8F2"/><stop offset="1" stop-color="#8A93B0"/></radialGradient><linearGradient id="voyGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE7A0"/><stop offset="0.5" stop-color="#E9B44C"/><stop offset="1" stop-color="#B9822E"/></linearGradient></defs>
  <g id="voyager" transform="translate(36.0 28.0)" stroke-linecap="round"><line x1="-2.0" y1="3.0" x2="-30.0" y2="17.0" stroke="#C9CFDE" stroke-width="0.50"/><line x1="1.0" y1="5.0" x2="14.0" y2="17.0" stroke="#C9CFDE" stroke-width="0.80"/><g transform="translate(14.0 17.0) rotate(42)"><rect x="-1.3" y="-4.0" width="2.6" height="8.0" rx="0.6" fill="#8E8A9E" stroke="#3A3650" stroke-width="0.30"/></g><line x1="-1.0" y1="4.0" x2="-11.0" y2="12.0" stroke="#C9CFDE" stroke-width="0.60"/><rect x="-14.0" y="10.5" width="4.0" height="3.0" fill="#B8BDD0" transform="rotate(30 -12.0 12.0)"/><path d="M-3.5 2.5 l2.0 -1.5 l3.0 0 l2.0 1.5 l0 3.0 l-2.0 1.5 l-3.0 0 l-2.0 -1.5 Z" fill="#2E2C44" stroke="#9AA2BE" stroke-width="0.30"/><circle cx="0.5" cy="4.6" r="1.3" fill="url(#voyGold)"/><ellipse cx="0" cy="-2.0" rx="11.0" ry="4.2" fill="url(#voyDish)" stroke="#5E6788" stroke-width="0.30"/><line x1="0" y1="-2.0" x2="0" y2="-7.0" stroke="#E4E8F2" stroke-width="0.50"/><circle cx="0" cy="-7.4" r="0.8" fill="#FFFFFF"/><line x1="-3.0" y1="6.0" x2="-9.0" y2="-11.0" stroke="#DDE2EE" stroke-width="0.25"/><line x1="2.0" y1="6.0" x2="9.0" y2="-12.0" stroke="#DDE2EE" stroke-width="0.25"/></g>
