<svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" viewBox="0 0 31 31">
  <!-- Charon (Kuiper belt), r 10.5 (ladder 34 sqrt(0.095)). Ids: cha*. Locked to Pluto: fixed face, airless.
       base #A9A3B4; Mordor Macula, the red north pole, #8E3A2C a0.85; the equatorial chasm belt #6E6A82; bright southern plains #C4BECF. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       ONE group #charon at translate(15.5 15.5); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
