  <g id="charon" transform="translate(15.5 15.5)"><circle r="10.5" fill="#A9A3B4"/><g clip-path="url(#chaClip)" filter="url(#chaTex)"><ellipse cx="0" cy="-8.9" rx="7.9" ry="4.2" fill="#8E3A2C" fill-opacity="0.85"/><path d="M-10.5 0.5 q10.5 -2.6 21.0 0" fill="none" stroke="#6E6A82" stroke-width="0.8" stroke-opacity="0.7"/><circle cx="2.1" cy="4.7" r="3.1" fill="#C4BECF" fill-opacity="0.7"/></g><circle r="10.5" fill="url(#chaShade)"/></g>
