  <!-- Eris (Kuiper belt), r 14.5 (ladder 34 sqrt(0.182)). Ids: eri*. Airless bright ice #EEF2FA with faint cool mottling #C9D2EA. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
