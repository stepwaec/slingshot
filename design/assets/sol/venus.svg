  <!-- Venus (Sol campaign), r 33 (ladder 34 sqrt(0.949)). Ids: ven*. Texture strip: period P = round(2 pi r), drawn over 2P with every feature at x and x + P, scrolled through the disc clip (SMIL translate 0 -> +P = west -> east). P = 207, scrolled RETROGRADE (+P -> 0) over 96 s, as the super-rotating clouds.
       No surface: a cloud deck LUT #EADBB6 / #F1DFAE / #E8CB8C / #F4E3B6 / #ECD198 (equator), waved 0.08 and swirled 9 px; streaks #FFF8E6 a0.2 / #C29A5C a0.22;
       two dark Y chevrons #C49A58 a0.32 opening west, soft (displaced, blur 1.2). Bright haze #FFF0C8 / #FFF8E6 a0.5 / 0.75, rim #FFF0CC / #F5D9A0. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       ONE group #venus at translate(41.1 41.1); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
