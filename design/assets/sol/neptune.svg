  <!-- Neptune (Sol campaign), r 67 (ladder 34 sqrt(3.88)). Ids: nep*. Texture strip: period P = round(2 pi r), drawn over 2P with every feature at x and x + P, scrolled through the disc clip (SMIL translate 0 -> +P = west -> east). P = 421, 120 s; start 48 W (the dark spot in view).
       Deep blue LUT #3E64D8 / #4A78EE / #3F6CE6 / #4B7DF2 (equator) / #3561DA / #4572EA / #5A88F2 / #3C5FD0; streaks #9CC0FF / #22409E.
       Great Dark Spot at 22 S #1C2F86 a0.85 with its white companion #F4F8FF along its south edge; the Scooter #F4F8FF at 42 S; the small dark spot D2 at
       55 S with a bright core; nine white cirrus streaks #F2F8FF a0.55-0.9 near 24-48 N/S. Haze #7FA8FF / #B8D0FF, rim #A8C4FF / #5E8CFF. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       Also: base disc #4475EC; shade highlight #DCE8FF; D2 #1E3290 with core #E8F2FF.
       ONE group #neptune at translate(76.0 76.0); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
