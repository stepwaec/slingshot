<svg xmlns="http://www.w3.org/2000/svg" width="41" height="41" viewBox="0 0 41 41">
  <!-- Pluto (Kuiper belt), r 14.7 (ladder 34 sqrt(0.186)). Ids: plu*. Locked to Charon: a fixed face (the New Horizons side), no strip.
       base #D2A27A; darker north #B9845E a0.8; Tombaugh Regio, the heart, #F6EBDD; Cthulhu #6B3322 along the west limb; a dark patch #8A4A30 SE; edges
       displaced by noise. Thin blue haze #C9D8FF / #E6EEFF a0.18 / 0.3. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       Also: shade highlight #FFF4E6; rim tail #9FB8F2.
       ONE group #pluto at translate(20.7 20.7); geometry relative to (0,0). Tokens and the size ladder: style.md §18. -->
