       1.64 r #8CCAD6 a0.28 · 1.70 r a0.24 · epsilon 1.80 r #B8E8EE a0.45 1.3 px · 2.0 r a0.14 - dark, faint rings. Lit from the upper-right, L = (+0.7071, -0.7071); a level points L at its star. Lighting never rotates: the planet reference construction (ocean.svg) -
       shade radial at 0.36 r along L, radius 1.25 r: highlight | 0.32 a0 | 0.64 #FF9455 a0 | ~0.70 #FF9455 a0.22-0.24 (warm terminator) | 0.76 #08122E a0.74 |
       0.84 #050B1E a0.96 | 1 a1 (airless bodies: hard terminator 0.69 / 0.73 / 0.755 / 0.80); haze and rim masked to the lit side.
       Also: base disc #9EDFE7; shade highlight #F0FFFE.
