        <path id="cmS15" d="M6 2.9 C135.4 8.3 241.8 35.3 322.4 73.6" stroke-width="1.3" stroke-opacity="0.4"/>
        <path id="cmS16" d="M6 3 C130.8 8.8 233.5 37.2 311.4 77.5" stroke-width="1.3" stroke-opacity="0.63"/>
