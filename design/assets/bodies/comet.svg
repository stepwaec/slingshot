<svg xmlns="http://www.w3.org/2000/svg" width="520" height="240" viewBox="0 0 520 240">
  <!-- Comet (WP10), v1.5 rules. ONE group #comet at translate(60 100); geometry relative to the nucleus at (0,0). Ids: cm*.
       Drawn with the STAR TO THE LEFT (-x): both tails point along +x. In a level, rotate the whole group so +x points exactly away from the
       star (angle = atan2(cy - starY, cx - starX)). Rotating is correct here because the lighting turns with it (the nucleus's lit side
       and the jets always face the star); this is the one body that rotates as a whole.
       Nucleus: crash radius 5 (peanut 8 x 5.4, rotated -18 deg). Coma radius 30 = the ice-harvest zone (dashed ring, planning only).
       Tail length: the #cmTails group is scaled (s, 0.6 + 0.4 s) with s = clamp(Rperi / d, 0.35, 1) (d = distance to the star, Rperi = the
       comet's perihelion distance from level data), so the tails are longest at perihelion. The head never scales.
       Draw order (bottom to top):
       1. #cmTails
          1a. dust base fill   between the outermost strands, linear along +x: #FFF1D0 a0.50 | 0.30 #FFE0A0 a0.24 | 0.60 #FFCC7A a0.07 | 0.74 a0
          1b. #cmDustStrands   24 crisp strands from the nucleus, curving to +y (they lag the orbit; flip the group's y when the comet moves
                               the other way round the star), ends x 296-392, y 14-110; width 0.6-2.0 px (the leading strand 2.0 at a0.95),
                               alpha 0.35-0.85 fading with spread; stroke = linear along +x: #FFFBF0 a1 | 0.20 #FFEBC0 a0.8 | 0.55 #FFD890 a0.38
                               | 0.85 #FFC266 a0.08 | 1 a0 (L 380)
          1c. dust sparkles    8 dots r 0.9-1.1 #FFF4D6 drifting out along strands (animateMotion 9-14 s), alpha 0 -> 0.9 -> 0.6 -> 0
          1d. ion base fill    wedge 4 px wide at the head -> 30 px at x 440, #8FE0FF a0.45 | 0.40 #3D9BFF a0.16 | 1 #2E62FF a0
          1e. #cmIonRays       7 straight rays (exactly anti-sunward, slight wobble <= 2.5 px), widths 1.8 / 1.0 / 1.0 / 0.7 / 0.7 / 0.5 / 0.5,
                               alpha 0.95 -> 0.35; stroke linear along +x: #E6FAFF a0.95 | 0.12 #7FD8FF a0.75 | 0.50 #3D9BFF a0.35 | 1 #2E62FF a0
          1f. solar-wind flow  dashed copies of the 3 central rays (60 40 / 44 56 / 36 64), dashoffset running outward over 2.2 / 2.8 / 3.1 s,
                               stroke #F2FCFF a0.6 | 0.35 #BFEFFF a0.35 | 0.8 #7FD8FF a0
          1g. disconnection knot  ellipse 24 x 10, #BFEFFF a0.75 -> #5EC8FF a0, travels x 40 -> 400 every 9 s (alpha 0 -> 0.8 -> 0.5 -> 0)
       2. coma     ellipse rx 50 ry 42 centred (5, 0): #E6FFF4 a0.85 | 0.15 #9DF7D6 a0.60 | 0.35 #5CEDBA a0.30 | 0.60 #3FD6A8 a0.10 | 0.82 a0.03 | 1 a0;
                   breathes x1.04 over 5 s. (The green is real: C2 gas glows green in comet comae.)
       3. jets     two sunward wedges to x -14, #E6FFF4 a0.75 -> #7CF5C8 a0
       4. core     circle r 11: #FFFFFF | 0.35 #F2FFFA a0.85 | 0.70 #C8FFE9 a0.25 | 1 a0
       5. nucleus  peanut, radial lit from (-2.5, -1): #F0E2CC | 0.45 #A88466 | 0.80 #4A362A | 1 #2A1E18; sunward rim arc #FFF1DC 0.6 px a0.85
       6. #cmHarvest  r 30, #7CF5C8 a0.45, 1 px, dash 4 4 crawling 8 px/s (planning and pause only)
       Tokens: style.md §8 WP10 (comet.*). -->
  <defs>
    <radialGradient id="cmComa" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E6FFF4" stop-opacity="0.85"/><stop offset="0.15" stop-color="#9DF7D6" stop-opacity="0.6"/><stop offset="0.35" stop-color="#5CEDBA" stop-opacity="0.3"/><stop offset="0.6" stop-color="#3FD6A8" stop-opacity="0.1"/><stop offset="0.82" stop-color="#3FD6A8" stop-opacity="0.03"/><stop offset="1" stop-color="#3FD6A8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cmCore" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/><stop offset="0.35" stop-color="#F2FFFA" stop-opacity="0.85"/><stop offset="0.7" stop-color="#C8FFE9" stop-opacity="0.25"/><stop offset="1" stop-color="#C8FFE9" stop-opacity="0"/></radialGradient>
    <linearGradient id="cmIon" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#E6FAFF" stop-opacity="0.95"/><stop offset="0.12" stop-color="#7FD8FF" stop-opacity="0.75"/><stop offset="0.5" stop-color="#3D9BFF" stop-opacity="0.35"/><stop offset="1" stop-color="#2E62FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="cmIonFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#8FE0FF" stop-opacity="0.45"/><stop offset="0.4" stop-color="#3D9BFF" stop-opacity="0.16"/><stop offset="1" stop-color="#2E62FF" stop-opacity="0"/></linearGradient>
    <linearGradient id="cmDust" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="380" y2="0"><stop offset="0" stop-color="#FFFBF0" stop-opacity="1"/><stop offset="0.2" stop-color="#FFEBC0" stop-opacity="0.8"/><stop offset="0.55" stop-color="#FFD890" stop-opacity="0.38"/><stop offset="0.85" stop-color="#FFC266" stop-opacity="0.08"/><stop offset="1" stop-color="#FFC266" stop-opacity="0"/></linearGradient>
    <linearGradient id="cmDustFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="380" y2="0"><stop offset="0" stop-color="#FFF1D0" stop-opacity="0.5"/><stop offset="0.3" stop-color="#FFE0A0" stop-opacity="0.24"/><stop offset="0.6" stop-color="#FFCC7A" stop-opacity="0.07"/><stop offset="0.74" stop-color="#FFCC7A" stop-opacity="0"/></linearGradient>
    <linearGradient id="cmJet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="-18" y2="0"><stop offset="0" stop-color="#E6FFF4" stop-opacity="0.75"/><stop offset="1" stop-color="#7CF5C8" stop-opacity="0"/></linearGradient>
    <radialGradient id="cmNuc" gradientUnits="userSpaceOnUse" cx="-2.5" cy="-1" r="7"><stop offset="0" stop-color="#F0E2CC"/><stop offset="0.45" stop-color="#A88466"/><stop offset="0.8" stop-color="#4A362A"/><stop offset="1" stop-color="#2A1E18"/></radialGradient>
    <linearGradient id="cmFlow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0"><stop offset="0" stop-color="#F2FCFF" stop-opacity="0.6"/><stop offset="0.35" stop-color="#BFEFFF" stop-opacity="0.35"/><stop offset="0.8" stop-color="#7FD8FF" stop-opacity="0"/></linearGradient>
    <radialGradient id="cmKnot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#BFEFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#5EC8FF" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="comet" transform="translate(60 100)">
    <g id="cmTails">
