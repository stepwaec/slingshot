        <use href="#cmR1" stroke-width="0.6" stroke-dasharray="44 56"><animate attributeName="stroke-dashoffset" from="0" to="-200" dur="2.8s" repeatCount="indefinite"/></use>
        <use href="#cmR2" stroke-width="0.6" stroke-dasharray="36 64"><animate attributeName="stroke-dashoffset" from="0" to="-200" dur="3.1s" repeatCount="indefinite"/></use>
