        <path id="cmS10" d="M6 2.3 C139.8 6 249.6 25.8 332.8 53.7" stroke-width="1.6" stroke-opacity="0.65"/>
        <path id="cmS11" d="M6 2.4 C140.7 6.4 251.2 27.5 335 57.3" stroke-width="0.6" stroke-opacity="0.66"/>
        <path id="cmS12" d="M6 2.6 C137.4 6.5 245.4 27.5 327.2 57.3" stroke-width="1.0" stroke-opacity="0.5"/>
        <path id="cmS13" d="M6 2.7 C142.9 7.1 255.3 30.1 340.3 62.7" stroke-width="0.6" stroke-opacity="0.32"/>
