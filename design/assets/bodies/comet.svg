      <ellipse rx="12" ry="5" fill="url(#cmKnot)" opacity="0"><animateMotion dur="9s" repeatCount="indefinite" path="M40 0 L400 -6"/><animate attributeName="opacity" values="0;0.8;0.5;0" keyTimes="0;0.08;0.5;1" dur="9s" repeatCount="indefinite"/></ellipse>
    </g>
    <ellipse cx="5" rx="50" ry="42" fill="url(#cmComa)"><animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="5s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1" repeatCount="indefinite"/></ellipse>
    <g fill="url(#cmJet)"><path d="M-1 -0.8 L-14 -7 L-13 -3.5 Z"/><path d="M-1 0.8 L-13 5.5 L-14 2.5 Z"/></g>
    <circle r="11" fill="url(#cmCore)"/>
    <g transform="rotate(-18)"><path d="M4.18 0.00 L4.39 0.68 L4.27 1.39 L3.48 1.87 L2.58 2.19 L1.54 2.16 L0.66 1.94 L0.00 1.89 L-0.69 2.03 L-1.55 2.17 L-2.54 2.15 L-3.57 1.92 L-4.06 1.32 L-4.27 0.66 L-4.42 0.00 L-4.31 -0.66 L-4.11 -1.34 L-3.63 -1.95 L-2.71 -2.29 L-1.51 -2.12 L-0.71 -2.11 L-0.00 -1.97 L0.71 -2.11 L1.64 -2.30 L2.64 -2.23 L3.56 -1.92 L3.96 -1.29 L4.29 -0.66Z" fill="url(#cmNuc)"/><path d="M4.18 0.00 L4.39 0.68 L4.27 1.39 L3.48 1.87 L2.58 2.19 L1.54 2.16 L0.66 1.94 L0.00 1.89 L-0.69 2.03 L-1.55 2.17 L-2.54 2.15 L-3.57 1.92 L-4.06 1.32 L-4.27 0.66 L-4.42 0.00 L-4.31 -0.66 L-4.11 -1.34 L-3.63 -1.95 L-2.71 -2.29 L-1.51 -2.12 L-0.71 -2.11 L-0.00 -1.97 L0.71 -2.11 L1.64 -2.30 L2.64 -2.23 L3.56 -1.92 L3.96 -1.29 L4.29 -0.66Z" fill="none" stroke="#FFF1DC" stroke-width="0.6" stroke-opacity="0.85" stroke-dasharray="0 6 9 40"/></g>
