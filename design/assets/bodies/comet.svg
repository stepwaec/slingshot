        <path id="cmS23" d="M6 3.8 C128.3 12.5 229.1 52.9 305.4 110.2" stroke-width="1.3" stroke-opacity="0.27"/>
      </g>
      <g fill="#FFF4D6">
        <circle r="1.1" opacity="0"><animateMotion dur="9s" begin="0s" repeatCount="indefinite"><mpath href="#cmS0"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="9s" begin="0s" repeatCount="indefinite"/></circle>
        <circle r="0.9" opacity="0"><animateMotion dur="11s" begin="-3s" repeatCount="indefinite"><mpath href="#cmS3"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
        <circle r="1.1" opacity="0"><animateMotion dur="10s" begin="-6s" repeatCount="indefinite"><mpath href="#cmS6"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
        <circle r="0.9" opacity="0"><animateMotion dur="12s" begin="-2s" repeatCount="indefinite"><mpath href="#cmS9"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="12s" begin="-2s" repeatCount="indefinite"/></circle>
        <circle r="1.1" opacity="0"><animateMotion dur="13s" begin="-8s" repeatCount="indefinite"><mpath href="#cmS13"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="13s" begin="-8s" repeatCount="indefinite"/></circle>
        <circle r="0.9" opacity="0"><animateMotion dur="12s" begin="-5s" repeatCount="indefinite"><mpath href="#cmS17"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="12s" begin="-5s" repeatCount="indefinite"/></circle>
        <circle r="1.1" opacity="0"><animateMotion dur="10s" begin="-7s" repeatCount="indefinite"><mpath href="#cmS2"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="10s" begin="-7s" repeatCount="indefinite"/></circle>
        <circle r="0.9" opacity="0"><animateMotion dur="14s" begin="-10s" repeatCount="indefinite"><mpath href="#cmS11"/></animateMotion><animate attributeName="opacity" values="0;0.9;0.6;0" keyTimes="0;0.1;0.6;1" dur="14s" begin="-10s" repeatCount="indefinite"/></circle>
      </g>
      <path d="M6 -2 L440 -16 L440 14 L6 2 Z" fill="url(#cmIonFill)"/>
