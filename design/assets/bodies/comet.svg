        <path id="cmR4" d="M7 0.7 C132 4.5 286 4.5 440 9" stroke-width="0.7" stroke-opacity="0.5"/>
        <path id="cmR5" d="M7 -1.2 C132 -5.6 286 -9.4 440 -15" stroke-width="0.5" stroke-opacity="0.35"/>
        <path id="cmR6" d="M7 1 C132 3.5 286 9.5 440 13" stroke-width="0.5" stroke-opacity="0.35"/>
