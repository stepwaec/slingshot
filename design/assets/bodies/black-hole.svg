  <g id="blackHole" transform="translate(160 160)">
    <circle r="66" fill="url(#bhGlow)"/>
    <g mask="url(#bhDoppler)">
      <g mask="url(#bhArcFadeTop)" opacity="0.70" filter="url(#bhArcBlur)">
        <path d="M-28.17 -4.97 A28.6 28.6 0 0 1 28.17 -4.97 L24.92 -4.39 A25.3 25.3 0 0 0 -24.92 -4.39 Z" fill="url(#bhArcRamp)"/>
