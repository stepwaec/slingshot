      <path d="M57.2 0 A57.2 57.2 0 1 0 -57.2 0 A57.2 57.2 0 1 0 57.2 0 Z M30.8 0 A30.8 30.8 0 1 1 -30.8 0 A30.8 30.8 0 1 1 30.8 0 Z" fill-rule="evenodd" fill="#000000" filter="url(#bhMottle)"/>
      <g mask="url(#bhStreakFade)">
      <g fill="#FFF8E1" filter="url(#bhStreakBlur)">
