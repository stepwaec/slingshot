<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Barren moon, v1.3 body library (small bodies). ONE group #moon at translate(30 30); geometry relative to (0,0).
       r 14, disc diameter H = 28. Lit side faces the star: L = (+0.7071, -0.7071) (upper-right). Lighting never rotates.
       Airless: NO atmosphere rim, NO cloud strip, NO polar caps, HARD terminator. Tokens: moon.base #9A9AA6 · moon.crater #5E5E6B ·
       moon.highlight #D8D8E0 ; the night side uses bg.base #050710 (existing token) because the moon has no shadow token of its own.

       Texture strip (v1.2 technique): period P = round(2*pi*r) = 88 px (one rotation). ONE rect 2P x 2r = 176x28 (never two abutting rects);
       the filter computes each noise field once over the 88x28 subregion (stitchTiles stitch -> periodic in exactly P) and feTile repeats it
       over the 176x28 region (two periods, one rect). Scrolled west->east (texture moves left->right): SMIL translate 0 -> +88 over 180 s
       through the circular clip #mnClip. Start phase: tile x 30 (strip x 132) at the disc's left edge (inner translate(-132 -14) = -(r + P + 30), -r);
       the visible window stays inside strip x in [30, 148] for the whole loop, so every crater is drawn twice (at x and x + P) and the
       period boundary is never seen as a cut.

       Draw order:
       1. base     circle r 14, #9A9AA6.
       2. surface  strip, SMIL translate 0 -> 88 over 180 s.
          2a. regolith  rect 176x28 fill #9A9AA6, filter #mnSurface (region 0..176 x 0..28):
                   maria = fractalNoise baseFrequency 0.05, numOctaves 3, seed 7: alpha -> linear slope 3, intercept -1.3 (soft 0.433..0.767),
                           coloured #5E5E6B, alpha x0.14 (large-scale mottle)
                   pits  = fractalNoise 0.30, numOctaves 1, seed 9: slope 30, intercept -19.3 (mid 0.66 = p93 of the field -> ~7 % cover, 1-2 px
                           specks), coloured #5E5E6B, alpha x0.50
                   merge SourceGraphic -> maria -> pits.
          2b. craters   37 seeded circles on the 88x28 tile (mulberry32 seed 0x4D4F4F; radii listed largest first, each placed at a random x in
                   [0,P) and y in [R+0.5, H-R-0.5], rejected while closer than 0.95 (R1+R2) to an accepted crater), 15.2 % of the tile
                   (+ ~7 % noise pits = ~22 % dark). Each crater = outer circle R, #D8D8E0 a0.55 (the rim wall) + bowl circle 0.82 R centred
                   (+0.18 R, -0.18 R) toward the star, fill #mnBowl = linear gradient from the bowl's upper-right (0.00 #5E5E6B a0.95, the shadowed
                   wall) through 0.55 a0.72 to its lower-left (1.00 a0.55); the uncovered crescent of the outer circle on the lower-left is the
                   sun-lit inner wall. Table (x y R): (60.4 13.4 4.2) · (43.3 22.2 3.8) · (10.7 17.3 3.4) · (51.2 13.8 3) · (50.9 21.1 2.6) · (77 23.5 2.4) · (34.5 7 2.3) · (45.3 4.2 2.1) · (25.7 23.3 2) · (41 11.1 1.9) · (35.6 25.7 1.8) · (0.3 16.8 1.6) · (57.9 20.3 1.55) · (61.4 20.4 1.5) · (28.4 5.8 1.45) · (8.7 7.9 1.4) · (80.4 9.6 1.35) · (6.2 6.1 1.3) · (15.6 3.4 1.25) · (17.7 23.9 1.2) · (32.5 4.3 1.2) · (19.3 22.1 1.15) · (54.8 3.5 1.1) · (55.1 16.5 1.1) · (12.2 1.7 1.05) · (46.6 19.1 0.9) · (18.7 12.4 0.9) · (86.2 23.8 0.9) · (3.1 5.5 0.9) · (13.6 4.3 0.9) · (37.2 8.6 0.9) · (60.4 3.6 0.9) · (69.9 2.4 0.9) · (54.7 21.5 0.9) · (58.9 23 0.9) · (28.3 1.8 0.9) · (21.4 7.3 0.9)
       3. squash   circle r 14, radial from the centre, #9A9AA6: 0.88 a0 | 1.00 a0.45 (fades the texture to 55 % in the outer 12 % of r).
       4. shade    radial, userSpace centre 0.36 r L = (3.56, -3.56), radius 1.5 r = 21 (NOT 1.25 r: with the hard step placed at 0.62-0.70 the larger
                   radius puts the terminator where v1.1's 0.78 mid-stop lands, ~0.62 r past the centre on the night side, so the night stays the
                   usual crescent instead of swallowing the disc):
                   0.00 #D8D8E0 a0.55 | 0.40 #9A9AA6 a0 | 0.62 #5E5E6B a0.30 | 0.70 #050710 a0.84 | 1.00 #050710 a0.92
                   (0.62-0.70 = hard terminator, 1.7 px wide at 1x; the night side is a dark grey ~#1A1B22 so the silhouette still reads on bg.base).
       5. limb     circle r 13.5, stroke 1, #D8D8E0 a0.14 (silhouette aid on the night side; not an atmosphere).
       No rim, no halo, no specular. Static renders show t = 0. Ids: mn*. -->
  <defs>
    <clipPath id="mnClip"><circle r="14"/></clipPath>
    <filter id="mnSurface" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="176" height="28" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="7" stitchTiles="stitch" x="0" y="0" width="88" height="28" result="mnC1"/>
      <feTile in="mnC1" x="0" y="0" width="176" height="28" result="mnC"/>
      <feComponentTransfer in="mnC" result="mnCCut">
        <feFuncA type="linear" slope="3" intercept="-1.3"/>
      </feComponentTransfer>
      <feColorMatrix in="mnCCut" type="matrix" values="0 0 0 0 0.369  0 0 0 0 0.369  0 0 0 0 0.420  0 0 0 0.14 0" result="mnMaria"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.30" numOctaves="1" seed="9" stitchTiles="stitch" x="0" y="0" width="88" height="28" result="mnB1"/>
      <feTile in="mnB1" x="0" y="0" width="176" height="28" result="mnB"/>
      <feComponentTransfer in="mnB" result="mnBCut">
        <feFuncA type="linear" slope="30" intercept="-19.3"/>
      </feComponentTransfer>
      <feColorMatrix in="mnBCut" type="matrix" values="0 0 0 0 0.369  0 0 0 0 0.369  0 0 0 0 0.420  0 0 0 0.50 0" result="mnPits"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="mnMaria"/>
        <feMergeNode in="mnPits"/>
      </feMerge>
    </filter>
    <linearGradient id="mnBowl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E5E6B" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#5E5E6B" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#5E5E6B" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="mnSquash" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="14">
      <stop offset="0.88" stop-color="#9A9AA6" stop-opacity="0"/>
      <stop offset="1" stop-color="#9A9AA6" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="mnShade" gradientUnits="userSpaceOnUse" cx="3.56" cy="-3.56" r="21">
      <stop offset="0" stop-color="#D8D8E0" stop-opacity="0.55"/>
      <stop offset="0.40" stop-color="#9A9AA6" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#5E5E6B" stop-opacity="0.30"/>
      <stop offset="0.70" stop-color="#050710" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#050710" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
