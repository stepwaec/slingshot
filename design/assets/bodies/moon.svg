<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Barren moon, v1.5 (revised: realistic + vibrant + crisp, built to reference/planet-ref.svg variant F; airless rules). ONE group #moon at
       translate(30 30); geometry relative to (0,0). Ids: mn*.
       r 14, disc diameter H = 28. Lit side faces the star: L = (+0.7071, -0.7071) (upper-right). Lighting never rotates.
       Airless: NO haze, NO rim, NO clouds, NO polar caps, NO limb line; crisp zones and craters; HARD terminator.
       Palette (v1.5 tokens; cool lavender-tinted greys - never untinted grey): moon.base #A6A2B6 · moon.shelf #7A7694 · moon.maria #4B4866 ·
         moon.highland #DDD9EC · moon.pit #3C3955 (also crater bowls) · moon.craterRim #EFECF8 · moon.highlight #F4F2FC ·
         shared terminator.warm #FF9455 · night #08122E / #050B1E  (v1.3 #9A9AA6 / #5E5E6B / #D8D8E0 retired).

       Texture strip: period P = round(2 pi r) = 88 px. ONE rect 2P x 2r = 176x28 (never two abutting rects); noise computed once over the 88x28
       subregion (stitchTiles stitch) and feTile'd over 176x28. Scrolled west->east: SMIL translate 0 -> +88 over 180 s through #mnClip.
       Start phase: inner translate(-132 -14) (tile x 30 at the disc's left edge); the visible window stays inside strip x [30, 148], so every
       crater is drawn twice (at x and x + P).

       Draw order:
       1. base     circle r 14, #A6A2B6.
       2. surface  strip, SMIL translate 0 -> 88 over 180 s.
          2a. regolith  rect 176x28 fill #A6A2B6, filter #mnSurface (region 0..176 x 0..28, sRGB):
                   n = fractalNoise 0.06, 6 oct, seed 7 · h = fractalNoise 0.11, 4 oct, seed 11 · p = fractalNoise 0.30, 1 oct, seed 9
                   (all stitched on the P x 2r tile, feTile'd over 2P). Crisp zones (alpha channel, linear threshold, then x alpha):
                     shelf   #7A7694 a0.5: n slope -36 (alpha 1 below 0.4722, 0 at 0.5)
                     dark    #4B4866 a0.9: n slope -40 (alpha 1 below 0.43, 0 at 0.455)
                     bright  #DDD9EC a0.5: h threshold 0.58 slope 28, composited IN the upland mask n > 0.49 (slope 14)
                     pits    #3C3955 a0.6: p threshold 0.643 slope 30 (1-2 px specks)
                     merge: base, shelf, dark, bright, pits.
          2b. craters   the v1.3 seeded table (37 craters, mulberry32 seed 0x4D4F4F, x y R unchanged), each drawn at x and x + P:
                   outer circle R #EFECF8 a0.75 (crisp sunlit rim wall) + bowl circle 0.82 R centred (+0.18 R, -0.18 R) toward the star, fill #mnBowl =
                   linear gradient from the bowl's upper-right (0.00 #3C3955 a0.95, the shadowed wall) through 0.55 a0.75 to its lower-left (1.00 a0.5).
                   Table (x y R): (60.4 13.4 4.2) · (43.3 22.2 3.8) · (10.7 17.3 3.4) · (51.2 13.8 3) · (50.9 21.1 2.6) · (77 23.5 2.4) · (34.5 7 2.3) · (45.3 4.2 2.1) · (25.7 23.3 2) · (41 11.1 1.9) · (35.6 25.7 1.8) · (0.3 16.8 1.6) · (57.9 20.3 1.55) · (61.4 20.4 1.5) · (28.4 5.8 1.45) · (8.7 7.9 1.4) · (80.4 9.6 1.35) · (6.2 6.1 1.3) · (15.6 3.4 1.25) · (17.7 23.9 1.2) · (32.5 4.3 1.2) · (19.3 22.1 1.15) · (54.8 3.5 1.1) · (55.1 16.5 1.1) · (12.2 1.7 1.05) · (46.6 19.1 0.9) · (18.7 12.4 0.9) · (86.2 23.8 0.9) · (3.1 5.5 0.9) · (13.6 4.3 0.9) · (37.2 8.6 0.9) · (60.4 3.6 0.9) · (69.9 2.4 0.9) · (54.7 21.5 0.9) · (58.9 23 0.9) · (28.3 1.8 0.9) · (21.4 7.3 0.9)
       3. shade    radial, userSpace centre 0.36 r L = (3.56, -3.56), radius 1.25 r = 17.5 (airless HARD terminator):
                   0 #F4F2FC a0.24 | 0.30 a0 | 0.69 #FF9455 a0 | 0.73 #FF9455 a0.18 (warm terminator band) | 0.755 #08122E a0.82 | 0.80 #050B1E a0.97 | 1.00 a1.
                   No haze, no rim, no limb line (airless).
       Static renders show t = 0. -->
  <defs>
    <clipPath id="mnClip"><circle r="14"/></clipPath>
    <filter id="mnSurface" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="176" height="28" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="6" seed="7" stitchTiles="stitch" x="0" y="0" width="88" height="28" result="mnSurfaceN1"/>
      <feTile in="mnSurfaceN1" x="0" y="0" width="176" height="28" result="mnSurfaceN"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="4" seed="11" stitchTiles="stitch" x="0" y="0" width="88" height="28" result="mnSurfaceH1"/>
      <feTile in="mnSurfaceH1" x="0" y="0" width="176" height="28" result="mnSurfaceH"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.30" numOctaves="1" seed="9" stitchTiles="stitch" x="0" y="0" width="88" height="28" result="mnSurfaceP1"/>
      <feTile in="mnSurfaceP1" x="0" y="0" width="176" height="28" result="mnSurfacePn"/>
      <feColorMatrix in="mnSurfaceN" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.463  0 0 0 0 0.580  0 0 0 1 0" result="mnSurfaceShelfRGB"/>
      <feComponentTransfer in="mnSurfaceShelfRGB" result="mnSurfaceShelfT"><feFuncA type="linear" slope="-36" intercept="18"/></feComponentTransfer>
      <feComponentTransfer in="mnSurfaceShelfT" result="mnSurfaceShelf"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feColorMatrix in="mnSurfaceN" type="matrix" values="0 0 0 0 0.294  0 0 0 0 0.282  0 0 0 0 0.400  0 0 0 1 0" result="mnSurfaceDarkRGB"/>
      <feComponentTransfer in="mnSurfaceDarkRGB" result="mnSurfaceDarkT"><feFuncA type="linear" slope="-40" intercept="18.2"/></feComponentTransfer>
      <feComponentTransfer in="mnSurfaceDarkT" result="mnSurfaceDark"><feFuncA type="linear" slope="0.9"/></feComponentTransfer>
      <feColorMatrix in="mnSurfaceH" type="matrix" values="0 0 0 0 0.867  0 0 0 0 0.851  0 0 0 0 0.925  0 0 0 1 0" result="mnSurfaceBriMRGB"/>
      <feComponentTransfer in="mnSurfaceBriMRGB" result="mnSurfaceBriMT"><feFuncA type="linear" slope="28" intercept="-16.24"/></feComponentTransfer>
      <feComponentTransfer in="mnSurfaceBriMT" result="mnSurfaceBriM"><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feColorMatrix in="mnSurfaceN" type="matrix" values="0 0 0 0 1.000  0 0 0 0 1.000  0 0 0 0 1.000  0 0 0 1 0" result="mnSurfaceUpRGB"/>
      <feComponentTransfer in="mnSurfaceUpRGB" result="mnSurfaceUp"><feFuncA type="linear" slope="14" intercept="-6.86"/></feComponentTransfer>
      <feComposite in="mnSurfaceBriM" in2="mnSurfaceUp" operator="in" result="mnSurfaceBright"/>
      <feColorMatrix in="mnSurfacePn" type="matrix" values="0 0 0 0 0.235  0 0 0 0 0.224  0 0 0 0 0.333  0 0 0 1 0" result="mnSurfacePitsRGB"/>
      <feComponentTransfer in="mnSurfacePitsRGB" result="mnSurfacePitsT"><feFuncA type="linear" slope="30" intercept="-19.29"/></feComponentTransfer>
      <feComponentTransfer in="mnSurfacePitsT" result="mnSurfacePits"><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="mnSurfaceShelf"/><feMergeNode in="mnSurfaceDark"/><feMergeNode in="mnSurfaceBright"/><feMergeNode in="mnSurfacePits"/></feMerge>
    </filter>
    <linearGradient id="mnBowl" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C3955" stop-opacity="0.95"/><stop offset="0.55" stop-color="#3C3955" stop-opacity="0.75"/><stop offset="1" stop-color="#3C3955" stop-opacity="0.5"/></linearGradient>
    <radialGradient id="mnShade" gradientUnits="userSpaceOnUse" cx="3.56" cy="-3.56" r="17.5">
      <stop offset="0" stop-color="#F4F2FC" stop-opacity="0.24"/>
      <stop offset="0.3" stop-color="#F4F2FC" stop-opacity="0"/>
      <stop offset="0.69" stop-color="#FF9455" stop-opacity="0"/>
      <stop offset="0.73" stop-color="#FF9455" stop-opacity="0.18"/>
      <stop offset="0.755" stop-color="#08122E" stop-opacity="0.82"/>
      <stop offset="0.8" stop-color="#050B1E" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#050B1E" stop-opacity="1"/>
    </radialGradient>
  </defs>
