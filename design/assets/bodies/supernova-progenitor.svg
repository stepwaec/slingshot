<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Supernova progenitor (WP12), v1.5 rules. ONE group #supernovaProgenitor at translate(0 0) (a sample in a 460 x 330 view). Ids: sp*.
       A star about to go supernova (WP12), with its planning telegraphs. The star is the red-giant asset (bodies/red-giant.svg) at scale 0.38-0.43 at
       (230, 170) (in the game: body.radius / 120); this sample shows a placeholder disc. Before `supernova.at` it is unstable: it breathes unevenly (scale 0.38 -> 0.41 -> 0.37 -> 0.43 over
       5.5 s, keyTimes 0 .2 .45 .8 1) and sheds faint shells from earlier outbursts (#FF5A8A 1.2 px, a0.32 / 0.22 / 0.14, drifting out 14 px per 12 s).
       Planning: the lethal blast radius `supernova.blast` as a dashed ring #FF5A5F a0.85 1.2 px (5 5, crawling 10 px/s) with "lethal blast r 96"; a countdown arc
       r 62, 3 px round caps, #FF9F43 over a #FFFFFF a0.12 track, emptying clockwise from 12 o'clock as `at` approaches (35 % left here), and "supernova in 0:48".
       Tokens: style.md §16. -->
  <defs><radialGradient id="spGiant" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF8A42"/><stop offset="0.65" stop-color="#F0602C"/><stop offset="1" stop-color="#C8401E"/></radialGradient></defs>
  <g id="supernovaProgenitor"><circle cx="230" cy="170" r="120" fill="none" stroke="#FF5A8A" stroke-opacity="0.32" stroke-width="1.2"><animate attributeName="r" values="120;134" dur="12s" repeatCount="indefinite"/></circle><circle cx="230" cy="170" r="150" fill="none" stroke="#FF5A8A" stroke-opacity="0.22" stroke-width="1.2"><animate attributeName="r" values="150;164" dur="12s" repeatCount="indefinite"/></circle><circle cx="230" cy="170" r="182" fill="none" stroke="#FF5A8A" stroke-opacity="0.14" stroke-width="1.2"><animate attributeName="r" values="182;196" dur="12s" repeatCount="indefinite"/></circle><g transform="translate(230 170)"><g><animateTransform attributeName="transform" type="scale" values="0.38;0.41;0.37;0.43;0.38" keyTimes="0;0.2;0.45;0.8;1" dur="5.5s" repeatCount="indefinite"/><circle r="120" fill="url(#spGiant)"/><circle r="120" fill="none" stroke="#FFC8A0" stroke-opacity="0.8" stroke-width="2.4"/></g></g><circle cx="230" cy="170" r="96" fill="none" stroke="#FF5A5F" stroke-opacity="0.85" stroke-width="1.2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/></circle><circle cx="230" cy="170" r="62" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/><circle cx="230" cy="170" r="62" fill="none" stroke="#FF9F43" stroke-width="3" stroke-linecap="round" stroke-dasharray="136.3 389.6" transform="rotate(-90 230 170)"/><g transform="translate(300 66)"><rect x="0" y="-11" width="124" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FF9F43" stroke-opacity="0.75"/><text x="6" y="1" font-size="10.5" fill="#FF9F43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">supernova in 0:48</text></g><g transform="translate(300 286)"><rect x="0" y="-11" width="124" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FF5A5F" stroke-opacity="0.75"/><text x="6" y="1" font-size="10.5" fill="#FF5A5F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">lethal blast r 96</text></g></g>
</svg>
