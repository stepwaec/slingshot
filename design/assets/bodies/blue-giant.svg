<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Blue giant (v1.3 body library). ONE group #blueGiant at translate(240 240); all geometry relative to (0,0). Ids bg*.
       = the v1.1 star construction scaled by k = 54/46 = 1.1739 (body r 54, corona to r 153) with a WIDER glow (to r 240 = the full half viewBox),
       re-coloured, fine granulation, 14 streamers instead of 10, plus the v1.3 prominences and flare. Lighting is self-emitted (no terminator).
       Tokens: core #FFFFFF . body #B8CCFF . corona #5EA0FF . glow #2C4FBF (limb = glow).
       Draw order (back to front):
       1. glow    circle r 240, #2C4FBF  stops 0.00 a0.50 | 0.23 a0.45 | 0.65 a0.12 | 1.00 a0
       2. corona  circle r 153, #5EA0FF  stops 0.00 a0.90 | 0.35 a0.70 | 0.62 a0.22 | 1.00 a0   blur sd 3.5
       3. streamers  14 wedges, fill #5EA0FF, blur sd 7. Base width w centred at r 56.3 (= 48 k), tip at r T, rotated by A (SVG degrees).
          From mulberry32(0x4247), draws in order angle, [reject if < 14 deg from an accepted angle - 14 wedges need the tighter rule],
          w = (10 + 8u) k, T = (110 + 65u) k, alpha = 0.10 + 0.06u:
            S1  A  29.0  w 19.6  T 163.1  a 0.126      S8  A 219.5  w 15.5  T 202.3  a 0.121
            S2  A 328.9  w 14.5  T 145.3  a 0.134      S9  A 128.4  w 17.4  T 144.4  a 0.156
            S3  A 111.1  w 17.5  T 155.5  a 0.143      S10 A 358.9  w 16.0  T 184.3  a 0.112
            S4  A 247.7  w 18.6  T 142.9  a 0.160      S11 A 310.5  w 19.9  T 147.0  a 0.145
            S5  A  51.5  w 14.7  T 154.7  a 0.137      S12 A 152.8  w 20.9  T 177.9  a 0.153
            S6  A  74.7  w 17.0  T 142.1  a 0.135      S13 A 292.9  w 17.7  T 174.6  a 0.140
            S7  A 184.2  w 13.1  T 205.2  a 0.145      S14 A 265.7  w 20.7  T 152.8  a 0.105
       4. helmet lobes  2 wedges, base 47 at r 56.3, tip r 176, #5EA0FF a0.06, angles 122 and 292, same blur sd 7.
          Layers 1-4 sit in <g id="bgBreathe">: SMIL scale 1 -> 1.03 -> 1 -> 0.97 -> 1 over 6 s (sine, +-3 %, t = 0 is the rest size).
       5. chromosphere  ring r 55.2, stroke 3.5, #5EA0FF a0.60, blur sd 1.8.
       5b. prominences  3 loops footed on the limb (r 54), stroke 2.9 (2.5 k), #5EA0FF, round caps, blur sd 1.8, drawn before the body.
          Loop i in <g transform="rotate(A_i) translate(54 0)">, path relative to its base point (x radial, y tangential), same construction as
          star.svg (feet at r cos(s/2) - r, -+ r sin(s/2); peak (k_i - 1) r; cubic controls (hc, -+ 0.8 r sin(s/2)), hc = (8 h - 2 x_foot) / 6).
          From mulberry32(0x4250): A = 360u [reject if < 70 deg from an accepted loop], s = 18 + 10u deg, k = 1.25 + 0.20u:
            P1  A 332.7  s 21.7  k 1.329   d="M-0.96 -10.15 C24.04 -8.12 24.04 8.12 -0.96 10.15"   dur 12 s  begin 0 s
            P2  A 243.5  s 22.9  k 1.314   d="M-1.08 -10.74 C22.95 -8.59 22.95 8.59 -1.08 10.74"   dur 16 s  begin 5 s
            P3  A 168.7  s 27.0  k 1.387   d="M-1.49 -12.6 C28.37 -10.08 28.37 10.08 -1.49 12.6"    dur 14 s  begin 9 s
          Per loop: scale about the base point 0.6 -> 1.0 -> 0.6 and opacity 0 -> 0.55 -> 0 over dur from begin, repeatCount indefinite, sine splines.
          Base attributes (before begin, t = 0): scale(0.6), opacity 0. Peaks: P1 6 s + 12 n, P2 13 s + 16 n, P3 16 s + 14 n.
       5c. flare  wedge M54 -1.75 L91.8 0 L54 1.75 Z (base 3.5 px on the limb, tip at 1.7 r) rotated to A 278.3 (next mulberry32(0x4250) draw, rejected
          if < 30 deg from a loop), linear gradient along the wedge #FFFFFF (limb) -> #B8CCFF (tip), no blur.
          Opacity over a 22 s cycle: 0 until 13 s, 0.7 at 13.9 s, 0 at 14.8 s (keyTimes 0 | 0.5909 | 0.6318 | 0.6727 | 1), repeatCount indefinite.
       6. body  circle r 54, radial (0.5,0.5): 0.00 #FFFFFF | 0.45 #B8CCFF | 0.78 #B8CCFF | 0.90 #5EA0FF | 1.00 #2C4FBF (limb)
       7. granulation  feTurbulence fractalNoise baseFrequency 0.16, numOctaves 2, seed 9, saturate 0, contrast x2 about 0.5, constant alpha 0.12,
          blend multiply, clipped to the body (finer and fainter than the sun's 0.11 / 0.16).
       Canvas: as star.svg (cached envelope + body sprites, 3 pre-blurred loop sprites scaled by 54/46 + 1 cached flare sprite; streamers blurred once at build time), colours and the tables above. -->
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2C4FBF" stop-opacity="0.50"/>
      <stop offset="0.23" stop-color="#2C4FBF" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#2C4FBF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2C4FBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgCorona" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EA0FF" stop-opacity="0.90"/>
      <stop offset="0.35" stop-color="#5EA0FF" stop-opacity="0.70"/>
      <stop offset="0.62" stop-color="#5EA0FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5EA0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#B8CCFF"/>
      <stop offset="0.78" stop-color="#B8CCFF"/>
      <stop offset="0.90" stop-color="#5EA0FF"/>
      <stop offset="1" stop-color="#2C4FBF"/>
    </radialGradient>
    <linearGradient id="bgFlareFill" gradientUnits="userSpaceOnUse" x1="54" y1="0" x2="91.8" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8CCFF"/>
    </linearGradient>
    <filter id="bgCoronaBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="bgStreamerBlur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bgChromoBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="bgPromBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="bgGranulation" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.16" numOctaves="2" seed="9" result="bgNoise"/>
      <feColorMatrix in="bgNoise" type="saturate" values="0" result="bgGrey"/>
      <feComponentTransfer in="bgGrey" result="bgGrain">
        <feFuncR type="linear" slope="2" intercept="-0.5"/>
        <feFuncG type="linear" slope="2" intercept="-0.5"/>
        <feFuncB type="linear" slope="2" intercept="-0.5"/>
        <feFuncA type="linear" slope="0" intercept="0.12"/>
      </feComponentTransfer>
      <feBlend in="bgGrain" in2="SourceGraphic" mode="multiply" result="bgShaded"/>
      <feComposite in="bgShaded" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <g id="blueGiant" transform="translate(240 240)">
    <g id="bgBreathe">
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1;0.97;1" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" dur="6s" repeatCount="indefinite"/>
      <circle r="240" fill="url(#bgGlow)"/>
      <circle r="153" fill="url(#bgCorona)" filter="url(#bgCoronaBlur)"/>
      <g fill="#5EA0FF" filter="url(#bgStreamerBlur)">
        <path d="M56.3 -9.81 L163.1 0 L56.3 9.81 Z" transform="rotate(29)" fill-opacity="0.126"/>
        <path d="M56.3 -7.26 L145.3 0 L56.3 7.26 Z" transform="rotate(328.9)" fill-opacity="0.134"/>
        <path d="M56.3 -8.74 L155.5 0 L56.3 8.74 Z" transform="rotate(111.1)" fill-opacity="0.143"/>
        <path d="M56.3 -9.3 L142.9 0 L56.3 9.3 Z" transform="rotate(247.7)" fill-opacity="0.160"/>
        <path d="M56.3 -7.33 L154.7 0 L56.3 7.33 Z" transform="rotate(51.5)" fill-opacity="0.137"/>
        <path d="M56.3 -8.5 L142.1 0 L56.3 8.5 Z" transform="rotate(74.7)" fill-opacity="0.135"/>
        <path d="M56.3 -6.57 L205.2 0 L56.3 6.57 Z" transform="rotate(184.2)" fill-opacity="0.145"/>
        <path d="M56.3 -7.73 L202.3 0 L56.3 7.73 Z" transform="rotate(219.5)" fill-opacity="0.121"/>
        <path d="M56.3 -8.72 L144.4 0 L56.3 8.72 Z" transform="rotate(128.4)" fill-opacity="0.156"/>
        <path d="M56.3 -8 L184.3 0 L56.3 8 Z" transform="rotate(358.9)" fill-opacity="0.112"/>
        <path d="M56.3 -9.93 L147 0 L56.3 9.93 Z" transform="rotate(310.5)" fill-opacity="0.145"/>
        <path d="M56.3 -10.44 L177.9 0 L56.3 10.44 Z" transform="rotate(152.8)" fill-opacity="0.153"/>
        <path d="M56.3 -8.85 L174.6 0 L56.3 8.85 Z" transform="rotate(292.9)" fill-opacity="0.140"/>
        <path d="M56.3 -10.35 L152.8 0 L56.3 10.35 Z" transform="rotate(265.7)" fill-opacity="0.105"/>
        <path d="M56.3 -23.5 L176 0 L56.3 23.5 Z" transform="rotate(122)" fill-opacity="0.06"/>
        <path d="M56.3 -23.5 L176 0 L56.3 23.5 Z" transform="rotate(292)" fill-opacity="0.06"/>
      </g>
    </g>
    <circle r="55.2" fill="none" stroke="#5EA0FF" stroke-opacity="0.60" stroke-width="3.5" filter="url(#bgChromoBlur)"/>
    <g id="bgProminences" fill="none" stroke="#5EA0FF" stroke-width="2.9" stroke-linecap="round">
      <g transform="rotate(332.7) translate(54 0)">
        <g id="bgProm1" transform="scale(0.6)" opacity="0">
          <animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" begin="0s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="12s" begin="0s" repeatCount="indefinite"/>
          <path d="M-0.96 -10.15 C24.04 -8.12 24.04 8.12 -0.96 10.15" filter="url(#bgPromBlur)"/>
        </g>
      </g>
      <g transform="rotate(243.5) translate(54 0)">
        <g id="bgProm2" transform="scale(0.6)" opacity="0">
          <animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="16s" begin="5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="16s" begin="5s" repeatCount="indefinite"/>
          <path d="M-1.08 -10.74 C22.95 -8.59 22.95 8.59 -1.08 10.74" filter="url(#bgPromBlur)"/>
        </g>
      </g>
      <g transform="rotate(168.7) translate(54 0)">
        <g id="bgProm3" transform="scale(0.6)" opacity="0">
          <animateTransform attributeName="transform" type="scale" values="0.6;1;0.6" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="14s" begin="9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.55;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="14s" begin="9s" repeatCount="indefinite"/>
          <path d="M-1.49 -12.6 C28.37 -10.08 28.37 10.08 -1.49 12.6" filter="url(#bgPromBlur)"/>
        </g>
      </g>
    </g>
    <g id="bgFlare" transform="rotate(278.3)" opacity="0">
      <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.5909;0.6318;0.6727;1" dur="22s" repeatCount="indefinite"/>
      <path d="M54 -1.75 L91.8 0 L54 1.75 Z" fill="url(#bgFlareFill)"/>
    </g>
    <circle r="54" fill="url(#bgBody)" filter="url(#bgGranulation)"/>
  </g>
</svg>
