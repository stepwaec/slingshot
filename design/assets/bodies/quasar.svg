<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Quasar (WP12), v1.5 rules. ONE group #quasar at translate(0 0) (a sample in a 460 x 330 view). Ids: qs*.
       A quasar (WP12): a supermassive black hole at (230, 165) with a blazing disk and twin relativistic jets along `quasar.angle` (here -28 deg).
       Glow r 90 radial #E6F4FF a0.5 | #9FC4FF a0.15 | 0. Disk rx 44 ry 13: radial #FFFFFF (0.33) | #E6F4FF (0.45) | #FFE7A0 a0.95 (0.62) | #FF8A3A a0.7 (0.8) |
       #E0408A a0 - white-hot inside; the front half drawn over the shadow (r 9 #000000, rim #FFF6D6 1.2 px). Jets from r 14 to `quasar.reach` (210 here),
       half-width 2.5 -> 11.5 with a ragged edge, linear #FFFFFF | 0.15 #DCF6FF a0.95 | 0.5 #5E9BFF a0.85 | 0.8 #8A5CFF a0.5 | 1 #A06BFF a0 (vivid blue into
       violet, never grey; in the game the violet sheath spans the lethal cone, half-width d tan(`quasar.cone`), the blue body 0.45 of it), a white core to 0.6 reach, and three knots (#FFFFFF a0.85, 12 x 5) racing out every 2.4 s. The jets are lethal: chip
       "jet: lethal along its length" (#FF5A5F). Tokens: style.md §16. -->
  <defs><radialGradient id="qsDisk" cx="0.5" cy="0.5" r="0.5"><stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.33" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#E6F4FF"/><stop offset="0.62" stop-color="#FFE7A0" stop-opacity="0.95"/><stop offset="0.8" stop-color="#FF8A3A" stop-opacity="0.7"/><stop offset="1" stop-color="#E0408A" stop-opacity="0"/></radialGradient><linearGradient id="qsJet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.15" stop-color="#DCF6FF" stop-opacity="0.95"/><stop offset="0.5" stop-color="#5E9BFF" stop-opacity="0.85"/><stop offset="0.8" stop-color="#8A5CFF" stop-opacity="0.5"/><stop offset="1" stop-color="#A06BFF" stop-opacity="0"/></linearGradient><radialGradient id="qsGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E6F4FF" stop-opacity="0.5"/><stop offset="0.4" stop-color="#9FC4FF" stop-opacity="0.15"/><stop offset="1" stop-color="#9FC4FF" stop-opacity="0"/></radialGradient><clipPath id="qsF230"><rect x="180" y="165" width="100" height="20"/></clipPath></defs>
