<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Rocky desert world, v1.3 body library (animated). ONE group #rocky at translate(60 60); geometry relative to (0,0).
       r 30, disc diameter H = 60. Lit side faces the star: L = (+0.7071, -0.7071) (upper-right; library convention). Lighting never rotates.
       Texture strip: period P = round(2*pi*r) = 188 px (one full rotation, 110 s). The strip is ONE rect 2P x 2r = 376x60 (v1.2 rule: never two
       abutting rects); the filter computes each noise field once over a 188x60 subregion (stitchTiles stitch -> periodic in exactly P) and feTile
       repeats it across the padded filter region, so the strip is 2P wide with no geometry edge and the offset/blur primitives see periodic neighbours.
       Scrolled west->east (texture moves left->right: translate 0 -> +P) through the circular clip #rkClip.
       Start phase: tile x 40 (strip x 228) at the disc's left edge (inner translate(-258 -30) = -(r + P + 40), -r). No polar caps (desert world).

       Tokens: rocky.base #C98B5A · rocky.dark #7A4E33 · rocky.highlight #F0C9A0 · rocky.atmo #E8B07A (thin, rim a 0.4).

       Draw order:
       1. base     circle r 30, #C98B5A.
       2. surface  strip, SMIL translate 0 -> 188 over 110 s. Strip = rect 376x60, fill #C98B5A, filter #rkSurface (region -4..380 x -4..64, cropped
                   back to the rect by feComposite in SourceGraphic). Fields (each: subregion 0..188 x 0..60 stitched, feTile over the region):
                   dunes:   feTurbulence fractalNoise baseFrequency "0.008 0.09" (anisotropic -> horizontal wavy bands), numOctaves 2, seed 5.
                            light bands: alpha -> linear slope 8, intercept -4.084 (soft threshold 0.573 = p75) then x0.40, colour #F0C9A0;
                            dark bands:  alpha -> linear slope -8, intercept 3.892 (bright where field < 0.424 = p25) then x0.40, colour #7A4E33.
                   craters: feTurbulence fractalNoise baseFrequency 0.12, numOctaves 2, seed 31.
                            pits: alpha -> linear slope 40, intercept -23.5 (threshold 0.600 = p80 -> ~20 % dark, ~1 px transition), x0.8, #7A4E33;
                            lit inner wall: pit minus pit offset (+1.2,-1.2) toward L = the lower-left inner edge, #F0C9A0 x0.6;
                            shadowed inner wall: pit minus pit offset (-1.2,+1.2) = the upper-right inner edge, #7A4E33 x0.6 (stacks on the pit).
       3. squash   circle r 30, radial from the centre, #C98B5A: 0.88 a0 | 1.00 a0.45 (fades the texture to 55 % in the outer 12 % of r).
       4. shade    radial, userSpace centre 0.36 r L = (7.64, -7.64), radius 1.25 r = 37.5 (v1.1 numbers):
                   0.00 #F0C9A0 a0.90 | 0.40 #C98B5A a0 | 0.70 #7A4E33 a0.55 | 0.86 #7A4E33 a0.92 | 1.00 #7A4E33 a1.0 (0.70-0.86 is the terminator).
       5. limb     circle r 29.5, stroke 1, #F0C9A0 a0.16.
       6. rim      circle r 1.12 r = 33.6, radial from the planet centre, #E8B07A: 0.00 a0 | 0.80 a0 | 0.87 a0.40 | 0.92 a0.22 | 1.00 a0
                   (v1.1 rim x 0.4/0.55 = thin atmosphere), multiplied (alpha mask) by a linear gradient along L from +1.12 r L (23.76,-23.76) = 1.0
                   to -1.12 r L = 0.35.
       No specular (no liquid), no halo. Static renders show t = 0. Ids: rk*. -->
  <defs>
    <clipPath id="rkClip"><circle r="30"/></clipPath>
    <filter id="rkSurface" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="-4" y="-4" width="384" height="68" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.09" numOctaves="2" seed="5" stitchTiles="stitch" x="0" y="0" width="188" height="60" result="rkD1"/>
      <feTile in="rkD1" x="-4" y="-4" width="384" height="68" result="rkD"/>
      <feColorMatrix in="rkD" type="matrix" values="0 0 0 0 0.941  0 0 0 0 0.788  0 0 0 0 0.627  0 0 0 1 0" result="rkDuneLRGB"/>
      <feComponentTransfer in="rkDuneLRGB" result="rkDuneLCut">
        <feFuncA type="linear" slope="8" intercept="-4.084"/>
      </feComponentTransfer>
      <feComponentTransfer in="rkDuneLCut" result="rkDuneL">
        <feFuncA type="linear" slope="0.40" intercept="0"/>
      </feComponentTransfer>
      <feColorMatrix in="rkD" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.306  0 0 0 0 0.200  0 0 0 1 0" result="rkDuneDRGB"/>
      <feComponentTransfer in="rkDuneDRGB" result="rkDuneDCut">
        <feFuncA type="linear" slope="-8" intercept="3.892"/>
      </feComponentTransfer>
      <feComponentTransfer in="rkDuneDCut" result="rkDuneD">
        <feFuncA type="linear" slope="0.40" intercept="0"/>
      </feComponentTransfer>
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="31" stitchTiles="stitch" x="0" y="0" width="188" height="60" result="rkC1"/>
      <feTile in="rkC1" x="-4" y="-4" width="384" height="68" result="rkC"/>
      <feColorMatrix in="rkC" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.306  0 0 0 0 0.200  0 0 0 1 0" result="rkPitRGB"/>
      <feComponentTransfer in="rkPitRGB" result="rkPitCut">
        <feFuncA type="linear" slope="40" intercept="-23.5"/>
      </feComponentTransfer>
      <feComponentTransfer in="rkPitCut" result="rkPit">
        <feFuncA type="linear" slope="0.8" intercept="0"/>
      </feComponentTransfer>
      <feOffset in="rkPitCut" dx="1.2" dy="-1.2" result="rkPitNE"/>
      <feComposite in="rkPitCut" in2="rkPitNE" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="rkLitA"/>
      <feColorMatrix in="rkLitA" type="matrix" values="0 0 0 0 0.941  0 0 0 0 0.788  0 0 0 0 0.627  0 0 0 0.6 0" result="rkLit"/>
      <feOffset in="rkPitCut" dx="-1.2" dy="1.2" result="rkPitSW"/>
      <feComposite in="rkPitCut" in2="rkPitSW" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="rkDarkA"/>
      <feColorMatrix in="rkDarkA" type="matrix" values="0 0 0 0 0.478  0 0 0 0 0.306  0 0 0 0 0.200  0 0 0 0.6 0" result="rkDark"/>
      <feMerge result="rkAll">
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="rkDuneL"/>
        <feMergeNode in="rkDuneD"/>
        <feMergeNode in="rkPit"/>
        <feMergeNode in="rkDark"/>
        <feMergeNode in="rkLit"/>
      </feMerge>
      <feComposite in="rkAll" in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="rkSquash" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="30">
      <stop offset="0.88" stop-color="#C98B5A" stop-opacity="0"/>
      <stop offset="1" stop-color="#C98B5A" stop-opacity="0.45"/>
    </radialGradient>
    <radialGradient id="rkShade" gradientUnits="userSpaceOnUse" cx="7.64" cy="-7.64" r="37.5">
      <stop offset="0" stop-color="#F0C9A0" stop-opacity="0.90"/>
      <stop offset="0.40" stop-color="#C98B5A" stop-opacity="0"/>
      <stop offset="0.70" stop-color="#7A4E33" stop-opacity="0.55"/>
      <stop offset="0.86" stop-color="#7A4E33" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#7A4E33" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="rkRim" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="33.6">
      <stop offset="0" stop-color="#E8B07A" stop-opacity="0"/>
      <stop offset="0.80" stop-color="#E8B07A" stop-opacity="0"/>
      <stop offset="0.87" stop-color="#E8B07A" stop-opacity="0.40"/>
      <stop offset="0.92" stop-color="#E8B07A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#E8B07A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rkRimLit" gradientUnits="userSpaceOnUse" x1="23.76" y1="-23.76" x2="-23.76" y2="23.76">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="rkRimMask" mask-type="alpha" maskUnits="userSpaceOnUse" x="-36" y="-36" width="72" height="72">
      <rect x="-36" y="-36" width="72" height="72" fill="url(#rkRimLit)"/>
    </mask>
  </defs>
  <g id="rocky" transform="translate(60 60)">
    <circle r="30" fill="#C98B5A"/>
    <g clip-path="url(#rkClip)">
      <g id="rkSurfaceAnim">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="188 0" dur="110s" repeatCount="indefinite"/>
        <g id="rkSurfaceStrip" transform="translate(-258 -30)">
          <rect width="376" height="60" fill="#C98B5A" filter="url(#rkSurface)"/>
        </g>
      </g>
    </g>
    <circle r="30" fill="url(#rkSquash)"/>
    <circle r="30" fill="url(#rkShade)"/>
    <circle r="29.5" fill="none" stroke="#F0C9A0" stroke-opacity="0.16" stroke-width="1"/>
    <circle r="33.6" fill="url(#rkRim)" mask="url(#rkRimMask)"/>
  </g>
</svg>
