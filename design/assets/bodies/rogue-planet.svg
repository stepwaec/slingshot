<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200">
  <!-- Rogue planet (WP11), v1.5 rules. ONE group #roguePlanet at translate(100 100); geometry relative to (0,0). r 36 (crash radius 36). Ids: rp*.
       A planet with NO STAR: nothing lights it, so it stays dark and is read by its edge and its own faint heat. It still has gravity (a slingshot mass),
       but no star means no solar recharge near it and no lit side.
       Draw order: 1. atmosphere glow r 43.9 (radial #3A5A9A a0 at 0.78 | #4E6FB8 a0.35 at 0.82 | #3A5A9A a0 at 1) - a thin cold airglow ring.
       2. body r 36, radial (0.5, 0.55): #1C1024 | 0.6 #100C1C | 1 #070912. 3. #rpBands (clipped): horizontal thermal bands, heights 0.08-0.2 r, colours #4A1428 /
       #2E0C1E / #6A2034 / #22091A at a0.18-0.42 (internal heat glowing deep red through the clouds), drifting west 2 r per 90 s (seamless double strip).
       4. three hot spots #FF6A3A r 0.05-0.09 r flickering a0.5 -> 0.15 (2.6-4.3 s). 5. cold rim: full circle #6E7FA6 a0.6 1 px + an upper arc #AFC2EE a0.85
       1.2 px (starlight from the galaxy). 6. #rpDrift (planning and pause only): dashed arrow #8B95B5 along its velocity (dash 4 5 crawling), since a rogue
       planet travels in a straight line through the level (constant velocity, not an orbit).
       Background stars must be hidden behind the disc (it is opaque) - the occultation is part of how it reads. Tokens: style.md §11 WP11. -->
  <defs>
    <radialGradient id="rpAtm" cx="0.5" cy="0.5" r="0.5"><stop offset="0.78" stop-color="#3A5A9A" stop-opacity="0"/><stop offset="0.82" stop-color="#4E6FB8" stop-opacity="0.35"/><stop offset="1" stop-color="#3A5A9A" stop-opacity="0"/></radialGradient>
    <radialGradient id="rpBody" cx="0.5" cy="0.55" r="0.55"><stop offset="0" stop-color="#1C1024"/><stop offset="0.6" stop-color="#100C1C"/><stop offset="1" stop-color="#070912"/></radialGradient>
    <clipPath id="rpC"><circle r="36"/></clipPath>
  </defs>
  <g id="roguePlanet" transform="translate(100 100)">
    <circle r="43.9" fill="url(#rpAtm)"/>
    <circle r="36" fill="url(#rpBody)"/>
    <g clip-path="url(#rpC)"><g id="rpBands">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-72 0" dur="90s" repeatCount="indefinite"/>
    <rect x="-36" y="-36.0" width="72" height="5.6" fill="#6A2034" fill-opacity="0.37"/>
    <rect x="-36" y="-30.4" width="72" height="7.0" fill="#4A1428" fill-opacity="0.38"/>
    <rect x="-36" y="-23.5" width="72" height="6.2" fill="#2E0C1E" fill-opacity="0.34"/>
    <rect x="-36" y="-17.2" width="72" height="6.8" fill="#4A1428" fill-opacity="0.27"/>
    <rect x="-36" y="-10.5" width="72" height="6.6" fill="#22091A" fill-opacity="0.31"/>
    <rect x="-36" y="-3.8" width="72" height="5.4" fill="#4A1428" fill-opacity="0.36"/>
    <rect x="-36" y="1.5" width="72" height="4.6" fill="#2E0C1E" fill-opacity="0.40"/>
    <rect x="-36" y="6.2" width="72" height="6.2" fill="#2E0C1E" fill-opacity="0.36"/>
    <rect x="-36" y="12.3" width="72" height="3.2" fill="#22091A" fill-opacity="0.21"/>
    <rect x="-36" y="15.5" width="72" height="2.9" fill="#4A1428" fill-opacity="0.23"/>
    <rect x="-36" y="18.4" width="72" height="3.8" fill="#2E0C1E" fill-opacity="0.39"/>
    <rect x="-36" y="22.2" width="72" height="4.1" fill="#2E0C1E" fill-opacity="0.31"/>
    <rect x="-36" y="26.4" width="72" height="5.8" fill="#2E0C1E" fill-opacity="0.22"/>
    <rect x="-36" y="32.2" width="72" height="7.1" fill="#2E0C1E" fill-opacity="0.41"/>
    <rect x="36" y="-36.0" width="72" height="5.6" fill="#6A2034" fill-opacity="0.37"/>
    <rect x="36" y="-30.4" width="72" height="7.0" fill="#4A1428" fill-opacity="0.38"/>
    <rect x="36" y="-23.5" width="72" height="6.2" fill="#2E0C1E" fill-opacity="0.34"/>
    <rect x="36" y="-17.2" width="72" height="6.8" fill="#4A1428" fill-opacity="0.27"/>
    <rect x="36" y="-10.5" width="72" height="6.6" fill="#22091A" fill-opacity="0.31"/>
    <rect x="36" y="-3.8" width="72" height="5.4" fill="#4A1428" fill-opacity="0.36"/>
    <rect x="36" y="1.5" width="72" height="4.6" fill="#2E0C1E" fill-opacity="0.40"/>
    <rect x="36" y="6.2" width="72" height="6.2" fill="#2E0C1E" fill-opacity="0.36"/>
    <rect x="36" y="12.3" width="72" height="3.2" fill="#22091A" fill-opacity="0.21"/>
    <rect x="36" y="15.5" width="72" height="2.9" fill="#4A1428" fill-opacity="0.23"/>
    <rect x="36" y="18.4" width="72" height="3.8" fill="#2E0C1E" fill-opacity="0.39"/>
    <rect x="36" y="22.2" width="72" height="4.1" fill="#2E0C1E" fill-opacity="0.31"/>
    <rect x="36" y="26.4" width="72" height="5.8" fill="#2E0C1E" fill-opacity="0.22"/>
    <rect x="36" y="32.2" width="72" height="7.1" fill="#2E0C1E" fill-opacity="0.41"/>
    </g>
    <circle cx="-10.8" cy="7.2" r="3.2" fill="#FF6A3A" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.5;0.15;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="9.0" cy="-12.6" r="2.2" fill="#FF6A3A" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.5;0.15;0.5" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="3.6" cy="18.0" r="1.8" fill="#FF6A3A" fill-opacity="0.5"><animate attributeName="fill-opacity" values="0.5;0.15;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="35.5" fill="none" stroke="#6E7FA6" stroke-opacity="0.6" stroke-width="1"/>
    <path d="M-25.6 -25.6 A36 36 0 0 1 25.6 -25.6" fill="none" stroke="#AFC2EE" stroke-opacity="0.85" stroke-width="1.2"/>
    <g id="rpDrift"><path d="M44 11 L146 49" stroke="#8B95B5" stroke-width="1.2" fill="none" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.5s" repeatCount="indefinite"/></path><path d="M146 49 l-9 -8 m9 8 l-11 3" stroke="#8B95B5" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>
  </g>
</svg>
