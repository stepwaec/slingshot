roke="#E6FAFF" stroke-opacity="0.8" stroke-width="0.7" stroke-linecap="round"/><rect x="-20" y="166" width="40" height="8" fill="url(#cyhShimmer)"><animate attributeName="x" values="-20;154" dur="4s" repeatCount="indefinite"/></rect></g><line x1="154.2" y1="163" x2="154.2" y2="177" stroke="#BFF4FF" stroke-width="1.2"/><text x="240" y="192" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#7CF5FF">cryosleep · ageing 0× · wake 0:12</tspan></text><text x="290" y="136" font-size="11" fill="#8B95B5">Just woke: groggy</text><text x="290" y="158" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><polyline transform="translate(340 154)" points="-7,0 -3,0 -1.6,-4.2 0.8,4.2 2.4,0 7,0" fill="none" stroke="#FFC09A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="510.0" y="158.0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1:50</text><rect x="290" y="166" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="290" y="166" width="134.2" height="8" rx="4" fill="#FFC09A"></rect><line x1="509" y1="163" x2="509" y2="177" stroke="#8B95B5" stroke-opacity="0.6" stroke-width="1"/><text x="510" y="192" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#8B95B5">ageing 1.00× · ship time</tspan></text><g transform="translate(346.0 216.0)"><rect x="0" y="-11" width="164" height="16" rx="5" fill="#0A0D1A" fill-opacity="0.88" stroke="#FFC09A" stroke-opacity="0.7"/><text x="6" y="1" font-size="10.5" fill="#FFC09A" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">groggy 0:05 · burns 70 %</text></g><text x="20" y="248" font-size="11" fill="#8B95B5">Low: under 25 %</text><text x="20" y="270" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><polyline transform="translate(70 266)" points="-7,0 -3,0 -1.6,-4.2 0.8,4.2 2.4,0 7,0" fill="none" stroke="#FF9F43" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="270.0" text-anchor="end" font-size="12" fill="#FF9F43" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0:34</text><rect x="20" y="278" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="20" y="278" width="41.8" height="8" rx="4" fill="#FF9F43"></rect><line x1="239" y1="275" x2="239" y2="289" stroke="#8B95B5" stroke-opacity="0.6" stroke-width="1"/><text x="240" y="304" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#FF9F43">0:34 of life left</tspan></text><text x="290" y="248" font-size="11" fill="#8B95B5">Critical: under 10 % (pulses)</text><text x="290" y="270" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><polyline transform="translate(340 266)" points="-7,0 -3,0 -1.6,-4.2 0.8,4.2 2.4,0 7,0" fill="none" stroke="#FF5A5F" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="510.0" y="270.0" text-anchor="end" font-size="12" fill="#FF5A5F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0:12</text><rect x="290" y="278" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="290" y="278" width="15.4" height="8" rx="4" fill="#FF5A5F"><animate attributeName="opacity" values="1;0.45;1" dur="1s" repeatCount="indefinite"/></rect><line x1="509" y1="275" x2="509" y2="289" stroke="#8B95B5" stroke-opacity="0.6" stroke-width="1"/><text x="510" y="304" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#FF5A5F">crew lost at 0:00</tspan></text></g>
