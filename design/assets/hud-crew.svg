<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="-apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif">
  <!-- Crew lifespan meter (v3.7, cryosleep). ONE group #hudCrew (a sample sheet: six states). Ids: cyh*.
       Placement: the LAST block of the right-hand ship-status stack (style.md §6, §10, §23), x 1180-1400: FUEL 48 · HULL 96 · (DOSE 144 when shown) · CREW at
       the next 48 px step, so baseline 144 without the dose meter and 192 with it. Status chips move below the stack (CREW baseline + 26).
       Block: "CREW" 11 px uppercase muted weight 500 · glyph at (x + 50, baseline - 4): awake a heartbeat trace 14 x 8.4, 1.4 px, in the bar colour; asleep a six-arm
       snowflake r 5.6 in cryo.glow · remaining lifespan "2:10" (ship time, m:ss) 12 px mono right-aligned at x 1400, #ECF0FA (crew.low / crew.crit / cryo.ice by
       state) · bar 220 x 8 at y + 8, track #FFFFFF a0.08, CONTINUOUS, filled from the left with the remaining fraction; a 1 px #8B95B5 a0.6 cap at the full lifespan.
       Fill: crew.life #FFC09A at >= 25 % · crew.low #FF9F43 below 25 % · crew.crit #FF5A5F below 10 % (pulses a1 -> 0.45, 1 s). 0:00 loses the mission.
       ASLEEP: the fill turns to ice (vertical gradient cryo.ice #BFF4FF -> cryo.glow #7CF5FF, a 1.2 px cryo.frost #E6FAFF top rim, white frost needles every 7 px,
       a white shimmer sweeping left -> right every 4 s) and a 1.2 px cryo.ice tick freezes its edge; the value turns cryo.ice and stops.
       Rate line (11 px mono, right-aligned at y + 34): "ageing 1.00× · ship time" muted (the crew ages in SHIP time, so time dilation slows it too: show the factor
       against outside time when it is below 0.995, "ageing 0.62× · deep well"); asleep "cryosleep · ageing 0× · wake 0:12" cryo.glow; low "0:34 of life left";
       critical "crew lost at 0:00".
       PLANNING ghost: the life this plan uses is hatched (crew.life stripes, skewed 35°) at the right end of the fill, with a 1.2 px #ECF0FA tick where the plan
       ends; the life the planned sleep keeps is an ice slice (as asleep) just left of that tick. Rate line "−0:39 on this path · cryo keeps 0:31" (crew.life · cryo.glow).
       GROGGY (optional wake-up penalty): for N s after waking, the chip "groggy 0:05 · burns 70 %" (crew.life border) under the block; burns are capped meanwhile.
       Tokens: style.md §23 (crew.*, cryo.*). -->
  <rect width="560" height="360" fill="#050710"/>
  <defs><linearGradient id="cyhFrost" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFF4FF"/><stop offset="1" stop-color="#7CF5FF"/></linearGradient><linearGradient id="cyhShimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><pattern id="cyhHatch" width="5" height="8" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)"><rect width="5" height="8" fill="#FFC09A" fill-opacity="0.22"/><rect width="2.2" height="8" fill="#FFC09A" fill-opacity="0.85"/></pattern></defs>
  <g id="hudCrew"><text x="20" y="24" font-size="11" fill="#8B95B5">Awake: ageing in ship time</text><text x="20" y="46" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><polyline transform="translate(70 42)" points="-7,0 -3,0 -1.6,-4.2 0.8,4.2 2.4,0 7,0" fill="none" stroke="#FFC09A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="240.0" y="46.0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2:10</text><rect x="20" y="54" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="20" y="54" width="158.4" height="8" rx="4" fill="#FFC09A"></rect><line x1="239" y1="51" x2="239" y2="65" stroke="#8B95B5" stroke-opacity="0.6" stroke-width="1"/><text x="240" y="80" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#8B95B5">ageing 1.00× · ship time</tspan></text><text x="290" y="24" font-size="11" fill="#8B95B5">Planning: this path uses 0:39; the sleep keeps 0:31</text><text x="290" y="46" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><polyline transform="translate(340 42)" points="-7,0 -3,0 -1.6,-4.2 0.8,4.2 2.4,0 7,0" fill="none" stroke="#FFC09A" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/><text x="510.0" y="46.0" text-anchor="end" font-size="12" fill="#ECF0FA" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2:10</text><rect x="290" y="54" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><rect x="290" y="54" width="110.7" height="8" rx="4" fill="#FFC09A"></rect><clipPath id="cyh1g"><rect x="396.7" y="54" width="51.7" height="8" rx="4"/></clipPath><rect x="396.7" y="54" width="51.7" height="8" fill="url(#cyhHatch)" clip-path="url(#cyh1g)"/><line x1="400.7" y1="51" x2="400.7" y2="65" stroke="#ECF0FA" stroke-width="1.2"/><rect x="362.8" y="54" width="37.8" height="8" fill="url(#cyhFrost)"/><rect x="362.8" y="54" width="37.8" height="1.2" fill="#E6FAFF" fill-opacity="0.85"/><line x1="509" y1="51" x2="509" y2="65" stroke="#8B95B5" stroke-opacity="0.6" stroke-width="1"/><text x="510" y="80" text-anchor="end" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"><tspan fill="#FFC09A">−0:39 on this path</tspan><tspan fill="#8B95B5"> · </tspan><tspan fill="#7CF5FF">cryo keeps 0:31</tspan></text><text x="20" y="136" font-size="11" fill="#8B95B5">Asleep: frozen, ageing stops</text><text x="20" y="158" font-size="11" font-weight="500" letter-spacing="1.54" fill="#8B95B5">CREW</text><g transform="translate(70 154)"><path d="M-0.00 -5.60 L0.00 5.60 M0.00 3.25 l1.30 1.54 M0.00 3.25 l-1.30 1.54 M-0.00 -3.25 l-1.30 -1.54 M-0.00 -3.25 l1.30 -1.54 M4.85 -2.80 L-4.85 2.80 M-2.81 1.62 l-0.69 1.89 M-2.81 1.62 l-1.99 -0.35 M2.81 -1.62 l0.69 -1.89 M2.81 -1.62 l1.99 0.35 M4.85 2.80 L-4.85 -2.80 M-2.81 -1.62 l-1.99 0.35 M-2.81 -1.62 l-0.69 -1.89 M2.81 1.62 l1.99 -0.35 M2.81 1.62 l0.69 1.89" fill="none" stroke="#7CF5FF" stroke-width="1.2" stroke-linecap="round"/></g><text x="240.0" y="158.0" text-anchor="end" font-size="12" fill="#BFF4FF" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">1:50</text><rect x="20" y="166" width="220" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.08"/><clipPath id="cyh2c"><rect x="20" y="166" width="134.2" height="8" rx="4"/></clipPath><g clip-path="url(#cyh2c)"><rect x="20" y="166" width="134.2" height="8" fill="url(#cyhFrost)"/><rect x="20" y="166" width="134.2" height="1.2" fill="#E6FAFF" fill-opacity="0.85"/><line x1="22.9" y1="167.5" x2="21.7" y2="169.8" stroke="#E6FAFF" stroke-opacity="0.8" stroke-width="0.7" stroke-linecap="round"/><line x1="28.4" y1="169.3" x2="31.9" y2="170.0" stroke="#E6FAFF" stroke-opacity="0.8" stroke-width="0.7" stroke-linecap="round"/><line x1="33.9" y1="169.7" x2="36.4" y2="170.2" stroke="#E6FAFF" stroke-opacity="0.8" stroke-width="0.7" stroke-linecap="round"/